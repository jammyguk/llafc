<style>
:root{
  --black:#000; --red:#ff0000; --green:#00ff00; --yellow:#ffff00; --blue:#0000ff; --magenta:#ff00ff; --cyan:#00ffff; --white:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:#000;color:var(--white);display:flex;justify-content:center;
  font-family:"VT323","Courier New",monospace;font-size:min(26px,5.6vw);line-height:1.1;-webkit-font-smoothing:none}
.tv{width:40ch;padding:.5em 0 1em}
.ln{white-space:pre;height:1.1em;overflow:hidden}
.band{background:var(--blue);color:var(--white)}
.dh{height:2.2em;overflow:hidden}
.dh span{display:block;transform:scaleY(2);transform-origin:top left;white-space:pre}
.w{color:var(--white)}.y{color:var(--yellow)}.c{color:var(--cyan)}.g{color:var(--green)}.m{color:var(--magenta)}.r{color:var(--red)}
.hl{background:var(--red);color:var(--white)}
.dim{color:#9a9a9a}
.logo{display:block;width:11ch;height:auto;margin:.3em 0}
.rowlogo{display:flex;gap:2ch;align-items:flex-start}
.fast{display:grid;grid-template-columns:repeat(5,1fr);margin-top:.6em}
.fast button{font:inherit;line-height:1.1;border:0;padding:.1em 0;cursor:pointer;color:#000;text-align:center}
.fast button[aria-current="page"]{outline:2px solid #fff;outline-offset:-2px}
.fast button:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.fast .fr{background:var(--red)}.fast .fg{background:var(--green)}.fast .fy{background:var(--yellow)}.fast .fc{background:var(--cyan)}.fast .fm{background:var(--magenta)}
.pick{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;color:var(--white);white-space:pre-wrap;
  line-height:1.1;padding:.2em 0;cursor:pointer;overflow:hidden}
.pick:hover,.pick:focus-visible{background:var(--blue);outline:none}
.pick.sel{color:var(--yellow)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}}
</style>

// Team shown the first time someone visits.
const DEFAULT={league:"u12-div1",team:"Loughborough Lions AFC U12 Reds"};
const LOGO="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACLAQAAAACBgqylAAADJUlEQVR42p2VMY8cNRiGH3tWt1MEzVBlFaLbQaImAYREgW4noqWIUqdYaFAQxUlpQAp3BlJcwQ8IRaT9EfT4wkk0QE6hoZwlp4AQipzokGbvZscU4/HaK+Cic7M7j/x9fu3v/Wxg1/rRgmRtnA0GsBD+a/NcOV4YDE1W+WUBRplZRDOmsHFm0jYCCpIQCAc92HCJPUgBRgHISefRKgVN5TT2yyoR61jufFdGIAEdbc5aZT///71UwwiU7SjVMshh75DZcC8nSrfzWQBucXjMrQBIXZtlGYCju1BcDsBFCeW9AGwKJdRBJKyUa0p/eBqBJXceujN1u2129i+HM2S9a02oQ7f7iW4DMD3cmP59GoBB+vbNvIhqe3wY68hMvRcCA1CHMwZ5WoQz6vLrK9IEwErvj076SfFgK/miL82nwO64bqNu0J8sYtPxzqNYWPX6QRMBM9yrI1DfzUwEGr0Zd0N747eSUAfDaq0rm2qtLq0+qwmdf87dtx88+eibdz97/OPDNx2Q14dKTn+ZvQQgrVXQyiffQjMQ1kqAankw4iqne33SIjn5E83GsQOj/Q8Zvf/yVwcA8plI278Wur1389fnai4KTCwjexGlYxiDVUmVqcysunJKDvkF7w9yUiiaHqSkDKD0SfOjzuIjv8r9ARIwfaEK1XTXzEqHBEWiemCdN7dXMzR1iU4j6QXVIAQNHPmkgpI2Z/nlfxaqUjtYKDTS3YrXAMX1Le/CrQY0mRdWd92iVi7EQIXy57FkBgZd05eh6+uhys5RF6xtVx+7zh/A49/j25L8ledrOfpAKUQBiFkFsBACGAPi9IJrf9lrlSuAAvnaYrVKDSznlN0TIQHfbdL8u/mbwr+TFUho8x6kugtJ18Pq/s8Y9zI9cODKvAv5HrZf/fk2bPUzFe9tf3wR0ThhpuQtM7+E7EFd8JMurzL4w4UkNbffePqMcd//wl0/E+VPPvoBJhogaTwYG4DMK2bYAEwqf5QnCUA5C0qoIbHBficGsiZ0RdNBPxILVkem0FEKmJgoBWTNJDabsP1Flviga/HJj+u1Ugz727IPaXMn4x+T8hmWmAKmHwAAAABJRU5ErkJggg==";
const W=40, tv=document.getElementById("tv");
const U=s=>String(s).toUpperCase(), cut=(s,n)=>U(s).slice(0,n).padEnd(n), rj=(s,n)=>String(s).padStart(n);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"], MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const dd=d=>String(d.getDate()).padStart(2,"0");
const ln=(t,c="w",x="")=>`<div class="ln ${c} ${x}">${esc(String(t).padEnd(W))}</div>`;
const band=(t,c="band")=>`<div class="ln ${c}">${esc((" "+t).padEnd(W))}</div>`;
const dh=(t)=>`<div class="dh band"><span>${esc((" "+t).slice(0,W).padEnd(W/2))}</span></div>`;
const pick=(a,v,t,sel)=>`<button class="pick${sel?" sel":""}" data-a="${a}" data-v="${esc(v)}">${esc(String(t))}</button>`;
const res=r=>{let x=r.f-r.a;if(!x&&r.pf!==undefined)x=r.pf-r.pa;return x>0?"W":x<0?"L":"D";};
const pdate=dt=>{const m=String(dt||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}:\d{2}))?/);
  if(!m)return null;let yr=+m[3];if(yr<100)yr+=2000;return {date:{day:+m[1],mon:+m[2],yr:yr},time:m[4]||""};};
// Full league name (with sponsor) comes from the competition field in the feed.
const lname=L=>{if(!L)return "";
  const c=(L.fixtures||[]).concat(L.results||[]).map(o=>o.competition||o.Competition).find(x=>x);
  return String(c||L.name||"").replace(/&amp;/g,"&").replace(/&#39;/g,"'").replace(/&quot;/g,'"').trim();};
// Standard short league name, e.g. "U12 DIV 2", worked out from the league id or the full name.
const lshort=(id,L)=>{
  const m=/^u(\d+)-div(\d+)$/i.exec(id)||/\bU(\d+)\s+DIV(?:ISION)?\s*(\d+)/i.exec(lname(L));
  return m?`U${m[1]} DIV ${m[2]}`:U(lname(L)||id);};
const lorder=(id,L)=>{const m=/^U(\d+) DIV (\d+)$/.exec(lshort(id,L));return m?(+m[1])*1000+(+m[2]):1e9;};
// Table page title: "U12 DIV 1 - D&J MOBILE CATERING LTD" (just "U12 DIV 2" when there is no sponsor).
const ltitle=(id,L)=>{
  const full=U(lname(L)), short=lshort(id,L);
  const rest=full.replace(/^U\d+\s+DIV(?:ISION)?\s*\d+\s*[-:]?\s*/,"").trim();
  return (rest&&rest!==full)?short+" - "+rest:short;};
// Word-wrap text to a width, so long names run on to a second line instead of being cut off.
function wrapText(t,w){const out=[];let line="";
  String(t).split(/\s+/).forEach(word=>{if(!word)return;
    if((line+" "+word).trim().length>w){if(line)out.push(line);line=word;}else line=(line+" "+word).trim();});
  if(line)out.push(line);return out.length?out:[""];}
const lines=(t,c="w",w=W)=>wrapText(t,w).map(x=>ln(x,c)).join("");
// Shorten a team name only as far as needed to fit n characters.
const ABBR=[[/\s+U\d{1,2}\b/g,""],[/\s+(AFC|FC)\b/g,""],[/\bJUNIORS\b/g,"JNRS"],[/\bJUNIOR\b/g,"JNR"],
  [/\s+20\d\d\b/g,""],[/\bATHLETIC\b/g,"ATH"],[/\bLOUGHBOROUGH\b/g,"LBORO"],[/\bHARBOROUGH\b/g,"HBORO"],
  [/\bUNITED\b/g,"UTD"],[/\s+SUNDAY\b/g,""],[/\s+TOWN\b/g,""],[/\bPARK\b/g,"PK"]];
function short(s,n){let t=U(s).trim();
  for(const [re,to] of ABBR){if(t.length<=n)break;t=t.replace(re,to);}
  // Still too long: trim the longest word, keeping the last word (usually the nickname) intact if possible.
  while(t.length>n){const w=t.split(" ");const last=w.length-1;let k=-1;
    w.forEach((x,i)=>{if(i<last&&x.length>3&&(k<0||x.length>w[k].length))k=i;});
    if(k<0)w.forEach((x,i)=>{if(x.length>3&&(k<0||x.length>w[k].length))k=i;});
    if(k<0)return t.slice(0,n);w[k]=w[k].slice(0,-1);t=w.join(" ");}
  return t;}

let STATE={league:DEFAULT.league,team:DEFAULT.team,pickLeague:null,note:"LOADING..."};
let RAW={leagues:{},updated:null};
let DATA={results:[],league:[],fixtures:[],table:[],teams:[],leagueName:"",updated:null};
let cur=100;
let CUPS=[];

function parseFeed(raw,us){
  const pk=(o,keys)=>{for(const k of keys){if(o[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k];}return undefined;};
  const clean=s=>String(s||"").replace(/&amp;/g,"&").replace(/&#39;/g,"'").replace(/&quot;/g,'"').trim();
  const teamMatches=name=>!!us&&U(clean(name))===U(clean(us));
  const ts=d=>new Date(d.yr,d.mon-1,d.day).getTime();
  const norm=o=>{
    const dt=String(pk(o,["fixtureDateTime","matchDate","date","Date","kickOff"])||"");
    const m=dt.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}:\d{2}))?/);
    let date=null,time="";
    if(m){let yr=+m[3];if(yr<100)yr+=2000;date={day:+m[1],mon:+m[2],yr:yr};time=m[4]||"";}
    const sc=String(pk(o,["score","result","scoreLine"])||"").match(/(\d+)\s*[-:–]\s*(\d+)/);
    let hs=pk(o,["homeScore","homeGoals","HomeScore"]);
    let as=pk(o,["awayScore","awayGoals","AwayScore"]);
    if(hs===undefined&&sc){hs=sc[1];as=sc[2];}
    return {home:clean(pk(o,["homeTeam","home","Home"])),away:clean(pk(o,["awayTeam","away","Away"])),
            date,time,hs:hs===undefined?NaN:+hs,as:as===undefined?NaN:+as};
  };
  const fx=(raw.fixtures||[]).map(norm).filter(x=>x.date);
  const rs=(raw.results||[]).map(norm).filter(x=>x.date);
  const today=new Date();today.setHours(0,0,0,0);

  const fixtures=fx.filter(f=>(teamMatches(f.home)||teamMatches(f.away))&&ts(f.date)>=today.getTime())
    .map(f=>({date:f.date,t:f.time,opp:teamMatches(f.home)?f.away:f.home,home:teamMatches(f.home)}))
    .sort((a,b)=>ts(a.date)-ts(b.date));

  const scored=rs.filter(r=>!isNaN(r.hs)&&!isNaN(r.as));
  const results=scored.filter(r=>teamMatches(r.home)||teamMatches(r.away))
    .map(r=>({date:r.date,opp:teamMatches(r.home)?r.away:r.home,home:teamMatches(r.home),
              f:teamMatches(r.home)?r.hs:r.as,a:teamMatches(r.home)?r.as:r.hs}))
    .sort((a,b)=>ts(b.date)-ts(a.date));

  const league=scored.map(r=>({date:r.date,home:r.home,away:r.away,hs:r.hs,as:r.as,
    own:teamMatches(r.home)||teamMatches(r.away)}));

  // Use a manually supplied table if the league has one, otherwise
  // calculate it from the scored results.
  let table;
  if(Array.isArray(raw.table)&&raw.table.length){
    table=raw.table.map(t=>({
      n:clean(pk(t,["teamName","team","name"])),
      p:+pk(t,["played","p"])||0, w:+pk(t,["won","w"])||0,
      d:+pk(t,["drawn","d"])||0, l:+pk(t,["lost","l"])||0,
      pts:+pk(t,["points","pts"])||0, noGd:true
    }));
    table.forEach(t=>{if(teamMatches(t.n))t.own=true;});
  } else {
    const tbl={};
    const touch=n=>tbl[n]||(tbl[n]={n,p:0,w:0,d:0,l:0,gf:0,ga:0});
    scored.forEach(r=>{
      const H=touch(r.home),A=touch(r.away);
      H.p++;A.p++;H.gf+=r.hs;H.ga+=r.as;A.gf+=r.as;A.ga+=r.hs;
      if(r.hs>r.as){H.w++;A.l++}else if(r.hs<r.as){A.w++;H.l++}else{H.d++;A.d++}
    });
    Object.values(tbl).forEach(t=>{t.pts=t.w*3+t.d;if(teamMatches(t.n))t.own=true;});
    table=Object.values(tbl);
  }

  // Every team that appears anywhere in this league's data.
  const names={};
  fx.concat(rs).forEach(x=>{[x.home,x.away].forEach(n=>{if(n)names[n]=1;});});
  table.forEach(t=>{if(t.n)names[t.n]=1;});
  const teams=Object.keys(names).sort((a,b)=>U(a).localeCompare(U(b)));

  return {fixtures,results,league,table,teams};
}

// Cup games come from cups.json (kept by hand, as the feed cannot read cups).
function addCups(){
  const us=U(STATE.team), today=new Date();today.setHours(0,0,0,0);
  const tsd=d=>new Date(d.yr,d.mon-1,d.day).getTime();
  DATA.cupRes=[];
  CUPS.forEach(c=>{
