.fast button[aria-current="page"]{outline:2px solid #fff;outline-offset:-2px}
.fast button:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.fast.six button{font-size:.8em}
.fast .fw{background:var(--white)}
.fast .fr{background:var(--red)}.fast .fg{background:var(--green)}.fast .fy{background:var(--yellow)}.fast .fc{background:var(--cyan)}.fast .fm{background:var(--magenta)}

.pick:hover,.pick:focus-visible{background:var(--blue);outline:none}
.sq{display:block;width:100%;box-sizing:border-box;background:#000;color:var(--yellow);border:0;border-bottom:2px solid var(--cyan);border-radius:0;font:inherit;caret-color:#fff;text-transform:uppercase;padding:.1em 0;margin:0 0 .4em;outline:none;-webkit-appearance:none}

.pick.sel{color:var(--yellow)}
.pick.more{color:var(--cyan);padding:.1em 0}
.vlink{color:var(--green);text-decoration:underline}
.vlink:hover,.vlink:focus-visible{background:var(--blue);outline:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}}

if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
(function(){
  // Shown on every visit until the site is opened as an installed app.
  const box=document.getElementById("inst");
  if(matchMedia("(display-mode: standalone)").matches||navigator.standalone)return;
  const fit=()=>document.documentElement.style.setProperty('--hint',(box.hidden?0:box.offsetHeight)+'px');
  const show=h=>{box.innerHTML=h;box.hidden=false;fit();};
  addEventListener('resize',fit);
  let ev=null,got=false;
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();ev=e;got=true;
    show('<button id="instgo" style="background:#0ff;color:#000;border:0;font:inherit;padding:0 .6em;cursor:pointer">INSTALL AS AN APP</button>');
    document.getElementById("instgo").onclick=()=>{ev.prompt();};});
  addEventListener("appinstalled",()=>{box.hidden=true;fit();});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent))
    show('<span style="color:#0ff">TO INSTALL: TAP SHARE, THEN "ADD TO HOME SCREEN"</span>');
  else setTimeout(()=>{if(!got)show('<span style="color:#0ff">TO INSTALL: OPEN THE BROWSER MENU, THEN "INSTALL APP" OR "ADD TO HOME SCREEN"</span>');},3000);
})();
</script>

const W=40, tv=document.getElementById("tv");
const U=s=>String(s).toUpperCase(), cut=(s,n)=>U(s).slice(0,n).padEnd(n), rj=(s,n)=>String(s).padStart(n);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"], MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const dd=d=>String(d.getDate()).padStart(2,"0");
const ln=(t,c="w",x="")=>`<div class="ln ${c} ${x}">${esc(String(t).padEnd(W))}</div>`;
const band=(t,c="band")=>`<div class="ln ${c}">${esc((" "+t).padEnd(W))}</div>`;
const dh=(t)=>`<div class="dh band"><span>${esc((String(t).length>=W?String(t):" "+t).slice(0,W).padEnd(W/2))}</span></div>`;
const morebtn=(a,v,t)=>`<button class="pick more" data-a="${a}" data-v="${esc(v)}">${esc(t)}</button>`;
const pick=(a,v,t,sel)=>`<button class="pick${sel?" sel":""}" data-a="${a}" data-v="${esc(v)}">${esc(String(t))}</button>`;
const res=r=>{let x=r.f-r.a;if(!x&&r.pf!==undefined)x=r.pf-r.pa;return x>0?"W":x<0?"L":"D";};
const pdate=dt=>{const m=String(dt||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}:\d{2}))?/);
  if(!m)return null;let yr=+m[3];if(yr<100)yr+=2000;return {date:{day:+m[1],mon:+m[2],yr:yr},time:m[4]||""};};
// Full league name (with sponsor) comes from the competition field in the feed.
const lname=L=>{if(!L)return "";
  const c=(L.fixtures||[]).concat(L.results||[]).map(o=>o.competition||o.Competition).find(x=>x);
  return String(c||L.name||"").replace(/&amp;/g,"&").replace(/&#39;/g,"'").replace(/&quot;/g,'"').trim();};
// Standard short league name, e.g. "U12 DIV 2", worked out from the league id or the full name.
const lshort=(id,L)=>{
  const m=/^u(\d+)-div(\d+)$/i.exec(id)||/\bU(\d+)\s+DIV(?:ISION)?\s*(\d+)/i.exec(lname(L));
  return m?`U${m[1]} DIV ${m[2]}`:U(lname(L)||id);};
const lorder=(id,L)=>{const m=/^U(\d+) DIV (\d+)$/.exec(lshort(id,L));return m?(+m[1])*1000+(+m[2]):1e9;};
// Table page title: "U12 DIV 1 - D&J MOBILE CATERING LTD" (just "U12 DIV 2" when there is no sponsor).
const ltitle=(id,L)=>{
  const full=U(lname(L)), short=lshort(id,L);
  const rest=full.replace(/^U\d+\s+DIV(?:ISION)?\s*\d+\s*[-:]?\s*/,"").trim();
  return (rest&&rest!==full)?short+" - "+rest:short;};
// Word-wrap text to a width, so long names run on to a second line instead of being cut off.
function wrapText(t,w){const out=[];let line="";
  String(t).split(/\s+/).forEach(word=>{if(!word)return;
    if((line+" "+word).trim().length>w){if(line)out.push(line);line=word;}else line=(line+" "+word).trim();});
  if(line)out.push(line);return out.length?out:[""];}
const lines=(t,c="w",w=W)=>wrapText(t,w).map(x=>ln(x,c)).join("");
// Shorten a team name only as far as needed to fit n characters.
const ABBR=[[/\s+U\d{1,2}\b/g,""],[/\s+(AFC|FC)\b/g,""],[/\bJUNIORS\b/g,"JNRS"],[/\bJUNIOR\b/g,"JNR"],
  [/\s+20\d\d\b/g,""],[/\bATHLETIC\b/g,"ATH"],[/\bLOUGHBOROUGH\b/g,"LBORO"],[/\bHARBOROUGH\b/g,"HBORO"],
  [/\bUNITED\b/g,"UTD"],[/\s+SUNDAY\b/g,""],[/\s+TOWN\b/g,""],[/\bPARK\b/g,"PK"]];
function short(s,n){let t=U(s).trim();
  for(const [re,to] of ABBR){if(t.length<=n)break;t=t.replace(re,to);}
  // Still too long: trim the longest word, keeping the last word (usually the nickname) intact if possible.
  while(t.length>n){const w=t.split(" ");const last=w.length-1;let k=-1;
    w.forEach((x,i)=>{if(i<last&&x.length>3&&(k<0||x.length>w[k].length))k=i;});
    if(k<0)w.forEach((x,i)=>{if(x.length>3&&(k<0||x.length>w[k].length))k=i;});
    if(k<0)return t.slice(0,n);w[k]=w[k].slice(0,-1);t=w.join(" ");}
  return t;}

let STATE={q:"",cx:{},league:DEFAULT.league,team:DEFAULT.team,pickLeague:null,note:"LOADING...",exp:{},all:false,tv:"full",age:""};
let RAW={leagues:{},updated:null};
let DATA={results:[],league:[],fixtures:[],table:[],teams:[],leagueFx:[],leagueName:"",updated:null};
let cur=100;
let CUPS=[];
let VEO=[];
// Veo footage link for the selected team's game on a date (from veo.json).
function veoUrl(date,opp){
  const us=U(STATE.team), o=U(opp||"");
  const e=VEO.find(x=>{const p=pdate(x.date);
    return x.url&&/^https:\/\//.test(x.url)&&p&&p.date.day==date.day&&p.date.mon==date.mon&&p.date.yr==date.yr&&U(x.team)==us&&
      (!x.opponent||o.includes(U(x.opponent))||U(x.opponent).includes(o));});
  return e?e.url:"";
}

function parseFeed(raw,us){
  const pk=(o,keys)=>{for(const k of keys){if(o[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k];}return undefined;};
  const clean=s=>String(s||"").replace(/&amp;/g,"&").replace(/&#39;/g,"'").replace(/&quot;/g,'"').trim();
  const teamMatches=name=>!!us&&U(clean(name))===U(clean(us));
  const ts=d=>new Date(d.yr,d.mon-1,d.day).getTime();
  const norm=o=>{
    const dt=String(pk(o,["fixtureDateTime","matchDate","date","Date","kickOff"])||"");
    const m=dt.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}:\d{2}))?/);
    let date=null,time="";
    if(m){let yr=+m[3];if(yr<100)yr+=2000;date={day:+m[1],mon:+m[2],yr:yr};time=m[4]||"";}
    const sc=String(pk(o,["score","result","scoreLine"])||"").match(/(\d+)\s*[-:–]\s*(\d+)/);
    let hs=pk(o,["homeScore","homeGoals","HomeScore"]);
    let as=pk(o,["awayScore","awayGoals","AwayScore"]);
    if(hs===undefined&&sc){hs=sc[1];as=sc[2];}
    return {home:clean(pk(o,["homeTeam","home","Home"])),away:clean(pk(o,["awayTeam","away","Away"])),
            date,time,removed:!!o.removed,hs:hs===undefined?NaN:+hs,as:as===undefined?NaN:+as};
  };
  const fx=(raw.fixtures||[]).map(norm).filter(x=>x.date);
  const rs=(raw.results||[]).map(norm).filter(x=>x.date);
  const today=new Date();today.setHours(0,0,0,0);

  // Full-Time lists a postponed game in its results as "Postponed"; the fixture carries on being listed alongside it.
  const ppd={};
  (raw.results||[]).forEach(o=>{if(/postponed/i.test(String(o.score||"")+String(o.homeScore||""))){
    const q=norm(o);if(q.date)ppd[clean(q.home)+"|"+clean(q.away)+"|"+q.date.day+"/"+q.date.mon+"/"+q.date.yr]=1;}});
  const rm=new Set((raw.fixtures||[]).filter(o=>o.removed).map(o=>clean(o.homeTeam)+"|"+clean(o.awayTeam)+"|"+String(o.fixtureDateTime||"").slice(0,8)));
  const status=f=>{const k=clean(f.home)+"|"+clean(f.away)+"|"+f.date.day+"/"+f.date.mon+"/"+f.date.yr;
    return ppd[k]?"POSTPONED":(f.removed?"REMOVED":"");};
  const fixtures=fx.filter(f=>(teamMatches(f.home)||teamMatches(f.away))&&ts(f.date)>=today.getTime())
    .map(f=>({date:f.date,t:f.time,opp:teamMatches(f.home)?f.away:f.home,home:teamMatches(f.home),st:status(f)}))
    .sort((a,b)=>ts(a.date)-ts(b.date));

  const scored=rs.filter(r=>!isNaN(r.hs)&&!isNaN(r.as));
  const results=scored.filter(r=>teamMatches(r.home)||teamMatches(r.away))
    .map(r=>({date:r.date,opp:teamMatches(r.home)?r.away:r.home,home:teamMatches(r.home),
              f:teamMatches(r.home)?r.hs:r.as,a:teamMatches(r.home)?r.as:r.hs}))
    .sort((a,b)=>ts(b.date)-ts(a.date));

  const league=scored.map(r=>({date:r.date,home:r.home,away:r.away,hs:r.hs,as:r.as,
    own:teamMatches(r.home)||teamMatches(r.away)}));

  // Use a manually supplied table if the league has one, otherwise
  // calculate it from the scored results.
  let table;
  if(Array.isArray(raw.table)&&raw.table.length){
    table=raw.table.map(t=>({
      n:clean(pk(t,["teamName","team","name"])),
      p:+pk(t,["played","p"])||0, w:+pk(t,["won","w"])||0,
      d:+pk(t,["drawn","d"])||0, l:+pk(t,["lost","l"])||0,
      pts:+pk(t,["points","pts"])||0, noGd:true
    }));
    table.forEach(t=>{if(teamMatches(t.n))t.own=true;});
  } else {
    const tbl={};
    const touch=n=>tbl[n]||(tbl[n]={n,p:0,w:0,d:0,l:0,gf:0,ga:0});
    scored.forEach(r=>{
      const H=touch(r.home),A=touch(r.away);
      H.p++;A.p++;H.gf+=r.hs;H.ga+=r.as;A.gf+=r.as;A.ga+=r.hs;
      if(r.hs>r.as){H.w++;A.l++}else if(r.hs<r.as){A.w++;H.l++}else{H.d++;A.d++}
    });
    Object.values(tbl).forEach(t=>{t.pts=t.w*3+t.d;if(teamMatches(t.n))t.own=true;});
    table=Object.values(tbl);
  }

  // Every team that appears anywhere in this league's data.
  const names={};
  fx.concat(rs).forEach(x=>{[x.home,x.away].forEach(n=>{if(n)names[n]=1;});});
  table.forEach(t=>{if(t.n)names[t.n]=1;});
  const teams=Object.keys(names).sort((a,b)=>U(a).localeCompare(U(b)));

  const leagueFx=fx.filter(f=>ts(f.date)>=today.getTime()).map(f=>({date:f.date,t:f.time,home:f.home,away:f.away,
    own:teamMatches(f.home)||teamMatches(f.away),st:status(f)}))
    .sort((a,b)=>ts(a.date)-ts(b.date)||String(a.t||"").localeCompare(String(b.t||""))||U(a.home).localeCompare(U(b.home)));

  return {fixtures,results,league,table,teams,leagueFx};
}

// Cup games come from cups.json (kept by hand, as the feed cannot read cups).
function addCups(){
  const us=U(STATE.team), today=new Date();today.setHours(0,0,0,0);
  const tsd=d=>new Date(d.yr,d.mon-1,d.day).getTime();
  DATA.cupRes=[];
  const played={};
  CUPS.forEach(c=>(c.results||[]).forEach(r=>{
    if(U(r.home)==us||U(r.away)==us)played[(c.name||"CUP")+"|"+r.date]=1;}));
  CUPS.forEach(c=>{
    const nm=c.name||"CUP";
    (c.fixtures||[]).forEach(f=>{
      const p=pdate(f.date);if(!p)return;
      const h=U(f.home)==us, a=U(f.away)==us;
      if(!(h||a)||tsd(p.date)<today.getTime())return;
      DATA.fixtures.push({date:p.date,t:p.time,opp:h?f.away:f.home,home:h,cup:nm});
    });
    (c.results||[]).forEach(r=>{
      const p=pdate(r.date);if(!p)return;
      const h=U(r.home)==us, a=U(r.away)==us;
      // Show the whole round (every match in this cup on this date) if the team played in it.
      if(h||a||played[nm+"|"+r.date])
        DATA.cupRes.push({date:p.date,home:r.home,away:r.away,hs:r.hs,as:r.as,pens:r.pens,name:nm,own:h||a});
      if(!(h||a))return;
      const x={date:p.date,opp:h?r.away:r.home,home:h,f:h?r.hs:r.as,a:h?r.as:r.hs,cup:nm};
      if(r.pens){x.pf=h?r.pens[0]:r.pens[1];x.pa=h?r.pens[1]:r.pens[0];}
      DATA.results.push(x);
    });
  });
  DATA.fixtures.sort((x,y)=>tsd(x.date)-tsd(y.date)||String(x.t).localeCompare(String(y.t)));
  DATA.results.sort((x,y)=>tsd(y.date)-tsd(x.date));
}

// Last-8 knockout bracket for a cup. Data comes from cups.json: "bracket":{"qf":[4 ties],"sf":[2 ties],"f":[1 tie]},
// each tie {home,away,hs,as,pens}. Anything not played yet shows as TBC.
function bracketHtml(cup,us){
  const B=cup.bracket||{}, qf=B.qf||[], sf=B.sf||[], fi=(B.f||[])[0];
  const win=t=>{if(!t||t.hs==null||t.as==null)return "";
    let d=t.hs-t.as;if(!d&&t.pens)d=t.pens[0]-t.pens[1];return d>0?t.home:d<0?t.away:"";};
  const q=i=>qf[i]||{};
  const teams=[q(0).home,q(0).away,q(1).home,q(1).away,q(2).home,q(2).away,q(3).home,q(3).away];
  const qw=[0,1,2,3].map(i=>win(qf[i]));
  const sw=[0,1].map(i=>win(sf[i]));
  const champ=win(fi);
  const g=Array.from({length:15},()=>Array.from({length:W},()=>[" ",""]));
  const put=(r,c,s,cl)=>{[...s].forEach((ch,i)=>{g[r][c+i]=[ch,cl];});};
  const nm=t=>(t?short(U(t).replace(/^LOUGHBOROUGH LIONS (AFC )?(U\d+ )?/,"LIONS "),11):"TBC").padEnd(11);
  const col=t=>t&&U(t)==us?"y":"w";
  const half=(n,s,f,o)=>{
    [0,2,4,6].forEach((r,k)=>{put(o+r,0,nm(n[k]),col(n[k]));put(o+r,11,"-+","c");});
    put(o+1,12,"|-","c");put(o+1,14,nm(s[0]),col(s[0]));put(o+1,25,"-+","c");
    put(o+5,12,"|-","c");put(o+5,14,nm(s[1]),col(s[1]));put(o+5,25,"-+","c");
    put(o+2,26,"|","c");put(o+4,26,"|","c");
    put(o+3,26,"|-","c");put(o+3,28,nm(f),col(f));
  };
  half(teams.slice(0,4),[qw[0],qw[1]],sw[0],0);
  half(teams.slice(4),[qw[2],qw[3]],sw[1],8);
  for(let r=3;r<=10;r++)put(r,39,(r==3||r==10)?"+":"|","c");
  const row=cells=>{let out="",cur=null,buf="";
    cells.forEach(([ch,cl])=>{cl=cl||"w";if(cl!==cur){if(buf)out+=`<span class="${cur}">${esc(buf)}</span>`;cur=cl;buf="";}buf+=ch;});
    return `<div class="ln">${out}<span class="${cur}">${esc(buf)}</span></div>`;};
  const hdr=Array.from({length:W},()=>[" ",""]);
  [[0,"QUARTER-FINAL"],[14,"SEMI-FINAL"],[28,"FINAL"]].forEach(([c,s])=>[...s].forEach((ch,i)=>{hdr[c+i]=[ch,"m"];}));
  let h=row(hdr)+g.map(row).join("")+ln("");
  const f1=fi&&fi.home?fi.home:(sw[0]||""), f2=fi&&fi.away?fi.away:(sw[1]||"");
  const sc=fi&&fi.hs!=null&&fi.as!=null?` ${fi.hs}-${fi.as} `:"  v  ";
  h+=band("THE FINAL")+ln("");
  h+=lines((f1?short(f1,16):"TBC")+sc+(f2?short(f2,16):"TBC"),"y");
  if(fi&&fi.pens)h+=ln("PENS "+fi.pens[0]+"-"+fi.pens[1],"y");
  if(champ)h+=ln("")+ln("WINNERS: "+short(champ,28),"g");
  return h+ln("");
}

function bindPicks(root){

// ---- Cup road: who is still in, who we could draw, and every tie so far (all collapsed until opened) ----
function cupRoad(c,nm,us){
  const tsd=d=>d.yr*10000+d.mon*100+d.day;
  const winOf=r=>{let d=r.hs-r.as;if(!d&&r.pens)d=r.pens[0]-r.pens[1];return d>0?r.home:d<0?r.away:"";};
  const rounds={};
  (c.results||[]).forEach(r=>{const p=pdate(r.date);if(!p)return;(rounds[tsd(p.date)]=rounds[tsd(p.date)]||{date:p.date,ties:[]}).ties.push(r);});
  const rkeys=Object.keys(rounds).sort((a,b)=>a-b);
  const futFx=(c.fixtures||[]).map(f=>({f,p:pdate(f.date)})).filter(x=>x.p);
  // Teams still in: winners of the latest round of results; or, if the next round is already fixed, the teams in it.
  let alive=[],lastScore={};
  if(rkeys.length){rounds[rkeys[rkeys.length-1]].ties.forEach(r=>{const w=winOf(r);if(w){alive.push(w);lastScore[w]=(U(w)==U(r.home)?r.hs+"-"+r.as:r.as+"-"+r.hs)+(r.pens?"p":"");}});}
  const fixedRound=futFx.length>0;
  if(fixedRound){alive=[];futFx.forEach(x=>{alive.push(x.f.home,x.f.away);});}
  const inCup=alive.some(t=>U(t)==us);
  const open=k=>STATE.cx[nm+"|"+k];
  const tog=(k,label)=>pick("cx",nm+"|"+k,(open(k)?"- ":"+ ")+label,false);
  let o="";
  o+=ln("THE ROAD TO THE FINAL","c");
  if(alive.length){
    o+=ln(`${alive.length} TEAMS ${fixedRound?"IN THIS ROUND":"STILL IN"}${inCup?"  - WE ARE IN":""}`,inCup?"y":"w");
    if(!fixedRound&&inCup){
      const divOf={};allTeams().forEach(t=>{const m=/(\d+)$/.exec(t.id);if(m&&!divOf[norm(t.n)])divOf[norm(t.n)]=+m[1];});
      const dv=t=>divOf[norm(t)]||99;
      const others=alive.filter(t=>U(t)!=us).sort((a,b)=>dv(a)-dv(b)||U(a).localeCompare(U(b)));
      o+=tog("draw",`WHO WE COULD DRAW (${others.length})`);
      if(open("draw")){
        o+=ln("DRAW NOT MADE YET - ANY OF THESE","m");
        others.forEach(t=>{
          const lions=U(t).includes("LOUGHBOROUGH LIONS");
          const d=dv(t),tag=(d==99?"--":"D"+d).padEnd(3);
          o+=ln(" "+tag+"- "+short(t,25).padEnd(25)+" "+rj(lastScore[t]||"",6),lions?"y":"w");});
        o+=ln(" (D=DIVISION --=OTHER LEAGUE P=PENS)","m");
      }
    }
  }
  // Every tie so far, one line each, grouped by round date
  const nties=(c.results||[]).length+futFx.length;
  if(nties){
    o+=tog("all",`EVERY TIE SO FAR (${nties})`);
    if(open("all")){
      const line=(h,mid,a)=>short(h,16).padEnd(16)+" "+mid+" "+short(a,16);
      const own=(h,a)=>U(h)==us||U(a)==us;
      rkeys.slice().reverse().forEach(k=>{const R=rounds[k];
        o+=band(`${String(R.date.day).padStart(2,"0")} ${MON[R.date.mon-1]} - ${R.ties.length} TIES`);
        R.ties.forEach(r=>{o+=ln(line(r.home,rj(r.hs,2)+"-"+(String(r.as)+(r.pens?"p":"")).padEnd(2),r.away),own(r.home,r.away)?"y":"w");});
      });
      const byD={};futFx.forEach(x=>{(byD[tsd(x.p.date)]=byD[tsd(x.p.date)]||{date:x.p.date,t:[]}).t.push(x.f);});
      Object.keys(byD).sort((a,b)=>a-b).forEach(k=>{const R=byD[k];
        o+=band(`${String(R.date.day).padStart(2,"0")} ${MON[R.date.mon-1]} - TO PLAY (${R.t.length})`);
        R.t.forEach(f=>{o+=ln(line(f.home," v  ",f.away),own(f.home,f.away)?"y":"w");});
      });
    }
  }
  o+=ln("BRACKET SHOWN FROM THE QUARTER-FINALS","c")+ln("");
  return o;
}

      const frows=DATA.table.slice().sort((a,b)=>b.pts-a.pts||((b.gf||0)-(b.ga||0))-((a.gf||0)-(a.ga||0))||(b.gf||0)-(a.gf||0));
      if(!frows.length) h+=ln("TABLE NOT AVAILABLE YET","w");
      frows.forEach((t,i)=>{
        const tn=U(t.n);
        const last=DATA.league.filter(r=>U(r.home)==tn||U(r.away)==tn).slice().sort((a,b)=>(a.date.yr*10000+a.date.mon*100+a.date.day)-(b.date.yr*10000+b.date.mon*100+b.date.day)).slice(-5);
        const L=last.map(r=>{const f=U(r.home)==tn?r.hs:r.as,a=U(r.home)==tn?r.as:r.hs;return f>a?["W","g"]:f<a?["L","r"]:["D","y"];});
        while(L.length<5)L.unshift([".","w"]);
        const form=L.map(([c,k])=>`<span class="${k}">${c}</span>`).join(" ");
        h+=`<div class="ln ${t.own?"y":"w"}">${esc(`${rj(i+1,2)} ${short(t.n,fnw).padEnd(fnw)} ${rj(t.p,2)} `)}${form}${esc(` ${rj(t.pts,3)}`.padEnd(W-(2+1+fnw+1+2+1+9)))}</div>`;
      });
      h+=ln("")+ln("LAST 5 LEAGUE GAMES - LATEST ON RIGHT","c");
    } else if(STATE.tv=="split"){
      const snw=17;
      h+=`<div class="ln band">${esc((rj("PO",2)+" "+"TEAM".padEnd(snw)+" "+"  HOME   "+" "+"  AWAY   ").padEnd(W))}</div>`;
      const srows=DATA.table.slice().sort((a,b)=>b.pts-a.pts||((b.gf||0)-(b.ga||0))-((a.gf||0)-(a.ga||0))||(b.gf||0)-(a.gf||0));
      if(!srows.length) h+=ln("TABLE NOT AVAILABLE YET","w");
      srows.forEach((t,i)=>{
        const tn=U(t.n), H={w:0,d:0,l:0}, A={w:0,d:0,l:0};
        DATA.league.forEach(r=>{
          if(U(r.home)==tn){if(r.hs>r.as)H.w++;else if(r.hs<r.as)H.l++;else H.d++;}
          else if(U(r.away)==tn){if(r.as>r.hs)A.w++;else if(r.as<r.hs)A.l++;else A.d++;}});
        const blk=o=>rj(o.w+"-"+o.d+"-"+o.l,6)+rj(o.w*3+o.d,3);
        h+=ln(`${rj(i+1,2)} ${short(t.n,snw).padEnd(snw)} ${blk(H)} ${blk(A)}`.slice(0,W),t.own?"y":"w");
      });
      h+=ln("")+ln("W-D-L AND POINTS, HOME THEN AWAY","c");
    } else {
    const hasGd=!(DATA.table[0]&&DATA.table[0].noGd);
    const nw=hasGd?17:21;
    h+=`<div class="ln band">${esc((rj("PO",2)+" "+"TEAM".padEnd(nw)+" "+rj("P",2)+" "+rj("W",2)+" "+rj("D",2)+" "+rj("L",2)+(hasGd?" "+rj("GD",3):"")+" "+rj("PTS",3)).padEnd(W))}</div>`;
    const rows=DATA.table.slice().sort((a,b)=>b.pts-a.pts||((b.gf||0)-(b.ga||0))-((a.gf||0)-(a.ga||0))||(b.gf||0)-(a.gf||0));
    if(!rows.length) h+=ln("TABLE NOT AVAILABLE YET","w");
    rows.forEach((t,i)=>{
      let s=`${rj(i+1,2)} ${short(t.n,nw).padEnd(nw)} ${rj(t.p,2)} ${rj(t.w,2)} ${rj(t.d,2)} ${rj(t.l,2)}`;
      if(hasGd){const gd=(t.gf||0)-(t.ga||0);s+=` ${rj((gd>0?"+":"")+gd,3)}`;}
      s+=` ${rj(t.pts,3)}`;
      h+=ln(s.slice(0,W),t.own?"y":"w");
    });
    }
  }
  if(p==104){
    h+=dh("CUPS")+ln(T,"c")+ln("");
    const us=T, shown=[];
    CUPS.forEach(c=>{
      const nm=c.name||"CUP";
      const rs=DATA.results.filter(x=>x.cup===nm).slice().reverse();
      const fx=DATA.fixtures.filter(x=>x.cup===nm);
      if(!rs.length&&!fx.length&&!c.bracket)return;
      shown.push(nm);
      wrapText(U(nm),W-1).forEach(x=>{h+=band(x);});
      rs.forEach(x=>{
        const r=res(x);
        const pre=`${String(x.date.day).padStart(2,"0")} ${MON[x.date.mon-1]}  ${r} ${x.f}-${x.a}  `, pn=x.pf!==undefined?" PENS":"";
        h+=ln(pre+short(x.opp,W-pre.length-pn.length)+pn,r=="W"?"g":r=="L"?"r":"y");
      });
      fx.forEach(x=>{
        h+=ln(`${String(x.date.day).padStart(2,"0")} ${MON[x.date.mon-1]}  ${x.home?"HOME":"AWAY"} ${short(x.opp,24)}`,"w");
      });
      h+=ln("");
      if(c.bracket)h+=bracketHtml(c,us);
      else h+=cupRoad(c,nm,us);
    });
    if(!shown.length)h+=ln("NOT IN ANY CUP YET","w");
  }
  if(p==110){
    h+=dh("CHOOSE A LEAGUE")+ln("")+searchBox();
    const ageOf=id=>{const m=/^U(\d+)/.exec(lshort(id,RAW.leagues[id]));return m?"U"+m[1]:"";};
    const ages=[...new Set(ids.map(ageOf).filter(Boolean))].sort();
    const age=ages.includes(STATE.age)?STATE.age:(ages.includes(ageOf(STATE.league))?ageOf(STATE.league):ages[0]);
    if(ages.length>1&&!STATE.q) h+=`<div class="agebar">${ages.map(a=>pick("age",a,"  "+a+" LEAGUES",a==age)).join("")}</div>`;
    const leaguesHtml=()=>ids.filter(id=>ages.length<2||ageOf(id)==age).sort((a,b)=>lorder(a,RAW.leagues[a])-lorder(b,RAW.leagues[b])).map(id=>pick("league",id,lshort(id,RAW.leagues[id]),id==STATE.league)).join("");
    LISTFN=()=>leaguesHtml();
    h+=`<div id="sres">${STATE.q?searchList(STATE.q):leaguesHtml()}</div>`;
  }
  if(p==111){
    const L=RAW.leagues[STATE.pickLeague]||{};
    const teams=parseFeed(L,"").teams;
    h+=dh("CHOOSE A TEAM")+lines(U(lname(L)),"c")+ln("")+searchBox();
    const teamsHtml=()=>{let o="";
      if(!teams.length) o+=ln("NO TEAMS FOUND YET","w");
      teams.forEach(n=>{
        const sel=STATE.pickLeague==STATE.league&&U(n)==U(STATE.team);
        o+=teamBtn("team",n,n,sel);
      });
      return o;};
    LISTFN=teamsHtml;
    h+=`<div id="sres">${STATE.q?searchList(STATE.q):teamsHtml()}</div>`;
    if(ids.length>1) h+=ln("")+pick("leagues","","  << ALL LEAGUES",false);
  }
  h+=ln("")+ln(DATA.updated?("UPDATED "+U(DATA.updated)).slice(0,W):STATE.note,"m");
  const keys=[["fr",100,"HOME"],["fg",101,"FIXTURES"],["fy",102,"RESULTS"],["fc",103,"TABLE"],["fm",110,"TEAMS"]];
  if(CUPS.length)keys.splice(4,0,["fw",104,"CUP"]);
  h+=`<nav class="fast${keys.length>5?" six":""}" style="grid-template-columns:repeat(${keys.length},1fr)" aria-label="Pages">`+keys.map(([c,n,l])=>
     `<button class="${c}" data-p="${n}" ${(n==p||(n==110&&p>=110))?'aria-current="page"':""}>${l}</button>`).join("")+`</nav>`;
  tv.innerHTML=h; cur=p;
  tv.querySelectorAll("button[data-p]").forEach(b=>b.onclick=()=>page(+b.dataset.p));
  bindPicks(tv);
  const sq=document.getElementById("sq");
  if(sq)sq.addEventListener("input",()=>{
    STATE.q=sq.value;const box=document.getElementById("sres");
    box.innerHTML=STATE.q.trim()?searchList(STATE.q):(LISTFN?LISTFN():"");bindPicks(box);});
}

setInterval(()=>{const o=document.getElementById("hd");if(o)o.outerHTML=head(cur);},1000);
document.addEventListener("keydown",e=>{if(e.target&&e.target.tagName==="INPUT")return;const k={"1":100,"2":101,"3":102,"4":103,"5":110,"6":104}[e.key];if(k)page(k);});

load();
fetch("data.json?_="+Date.now())
  .then(r=>r.json())
  .then(raw=>{
    // Older data.json files had a single league at the top level.
    if(!raw.leagues){
      raw={updated:raw.updated,leagues:{"u12-div1":{name:"U12 Div 1 D&J Mobile Catering Ltd",
        fixtures:raw.fixtures,results:raw.results,table:raw.table}}};
    }
    RAW=raw;
    if(!RAW.leagues[STATE.league]){STATE.league=DEFAULT.league;STATE.team=DEFAULT.team;}
    if(!RAW.leagues[STATE.league]){const k=Object.keys(RAW.leagues)[0];if(k)STATE.league=k;}
    return fetch("cups.json?_="+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null).then(c=>{
      CUPS=(c&&c.cups)||[];
      return fetch("veo.json?_="+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null).then(v=>{
        VEO=(v&&v.links)||[];compute();page(100);});});
  })
  .catch(()=>{STATE.note="COULDN'T LOAD DATA.JSON";page(100);});

page(100);
</script>
</body>
</html>
