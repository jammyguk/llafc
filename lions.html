<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loughborough Lions AFC Teams</title>
<meta name="description" content="Every Loughborough Lions AFC youth team: next match, latest result and league position.">
<meta name="theme-color" content="#14161A"><link rel="icon" href="crest.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F2F3F0;--card:#fff;--ink:#14161A;--line:#DADCD6;--muted:#5E636B;--gold:#D6A21F;--gold-soft:#FBF0CC;--gold-ink:#6B4F00;--win:#1E8449;--draw:#7B818A;--loss:#B83A3A;--block:#14161A;--block-ink:#fff;color-scheme:light}
:root[data-theme=dark]{--paper:#0F1114;--card:#181B20;--ink:#EEF0EC;--line:#2A2E35;--muted:#9AA0A8;--gold:#E3B341;--gold-soft:#3A3018;--gold-ink:#F2D88A;--win:#3DB06B;--draw:#8A9099;--loss:#E0605E;--block:#EEF0EC;--block-ink:#14161A;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#0F1114;--card:#181B20;--ink:#EEF0EC;--line:#2A2E35;--muted:#9AA0A8;--gold:#E3B341;--gold-soft:#3A3018;--gold-ink:#F2D88A;--win:#3DB06B;--draw:#8A9099;--loss:#E0605E;--block:#EEF0EC;--block-ink:#14161A;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.45 "Hanken Grotesk",system-ui,sans-serif;padding-bottom:76px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.disp{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:700;letter-spacing:.01em;line-height:1}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.sr{position:absolute;left:-9999px}
/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);border-bottom:3px solid var(--gold)}
:root[data-theme=dark] header.top,:root:not([data-theme=light]) header.top{--hb:#000}
header .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand b{font:700 22px/1 "Big Shoulders Display";letter-spacing:.02em;white-space:nowrap}
.brand small{display:none;color:#B9BDC4;font-size:13px}
@media(max-width:520px){.brand b{display:none}}
.hbtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:14px;max-width:48vw}
.hbtn{flex:none}.hbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.18)}
.icon{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}
.icon:hover{background:rgba(255,255,255,.18)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;padding:10px 2px 9px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--ink);border-top-color:var(--gold)}
/* badge */
.badge{--s:40px;width:var(--s);height:calc(var(--s)*1.1);flex:none;display:inline-grid;place-items:center;position:relative;color:#fff;font:700 calc(var(--s)*.42)/1 "Big Shoulders Display";letter-spacing:.02em;
 clip-path:path("M0 0")}
.badge{clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);border-radius:0}
.badge.img{background:#000}
.badge.img img{width:100%;height:100%;object-fit:contain;display:block}
.badge.mono{background:linear-gradient(160deg,hsl(var(--h) 45% 38%),hsl(var(--h) 50% 26%))}
.badge.mono i{font-style:normal;transform:translateY(-8%)}
.badge.mono::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 45%);pointer-events:none}
.bwrap{display:inline-flex;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
/* title */
.title{padding:28px 0 8px;display:flex;gap:16px;align-items:center}
.title h1{font:800 clamp(34px,7vw,56px)/.95 "Big Shoulders Display";letter-spacing:.005em}
.title p{color:var(--muted);margin-top:6px}
.title p b{color:var(--ink);font-weight:600}
h2.sec{font:700 26px/1 "Big Shoulders Display";margin:0 0 12px}
.grid{display:grid;gap:20px;margin-top:16px}
@media(min-width:860px){.grid.two{grid-template-columns:1.15fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.flat{padding:0;overflow:hidden}
/* hero */
.hero{background:var(--block);color:var(--block-ink);border-radius:16px;padding:22px;position:relative;overflow:hidden;border-bottom:5px solid var(--gold)}
.hero .when{font:700 clamp(28px,5.4vw,40px)/1 "Big Shoulders Display";color:var(--gold)}
.hero .vs{display:flex;align-items:center;gap:14px;margin:16px 0 4px}
.hero .vs .n{font:800 clamp(30px,6.4vw,46px)/.95 "Big Shoulders Display"}
.hero .vs .a{font-size:13px;opacity:.7;margin-bottom:2px}
.hero .meta{opacity:.78;font-size:14px;margin-top:6px}
.count{display:flex;gap:8px;margin-top:20px}
.count div{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 0 8px;width:72px;text-align:center}
:root[data-theme=dark] .count div{background:rgba(0,0,0,.08)}
.count b{display:block;font:800 36px/1 "Big Shoulders Display"}
.count small{font-size:12px;opacity:.7}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--gold);color:#14161A;margin-top:12px}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1.5px solid currentColor;color:var(--muted);white-space:nowrap}
.chip.h{color:var(--ink)}
.cup-tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold-ink)}
/* form */
.form{display:flex;gap:6px}
.f{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font:700 18px/1 "Big Shoulders Display"}
.f.W{background:var(--win)}.f.D{background:var(--draw)}.f.L{background:var(--loss)}
/* scorebug */
.bug{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.bug:first-child{border-top:0}
.bug .t{display:flex;align-items:center;gap:10px;min-width:0;font-weight:500}
.bug .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bug .t.r{justify-content:flex-end;text-align:right}
.bug .t.r span{order:-1}
.bug .sc{background:var(--block);color:var(--block-ink);border-radius:8px;padding:6px 12px;font:800 24px/1 "Big Shoulders Display";min-width:76px;text-align:center;white-space:nowrap}
.bug .sc small{display:block;font:600 11px/1.2 "Hanken Grotesk";opacity:.75;margin-top:2px}
.bug.own{background:var(--gold-soft)}
.bug.own .t.us span{font-weight:700}
.bug .badge{--s:28px}
@media(max-width:520px){.bug{grid-template-columns:1fr auto;gap:6px 10px;padding:11px 12px}.bug .t{font-size:15px}.bug .t.r{justify-content:flex-start;text-align:left}.bug .t.r span{order:0}
 .bug>.t:nth-child(1){grid-column:1;grid-row:1}.bug>.t.r{grid-column:1;grid-row:2}.bug .sc{grid-column:2;grid-row:1/3;align-self:stretch;display:grid;place-content:center;min-width:64px}
 .title h1{font-size:clamp(28px,8vw,40px)}.title .badge{--s:56px!important}.title{gap:12px}}
.veo{grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:-2px}
.veo a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-decoration:none;background:var(--ink);color:var(--paper);padding:5px 12px;border-radius:99px}
.veo a:hover{background:var(--gold);color:#14161A}
.datehead{display:flex;align-items:baseline;gap:10px;padding:18px 0 8px}
.datehead h3{font:700 24px/1 "Big Shoulders Display"}
.datehead span{color:var(--muted);font-size:14px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-top:6px}
.seg button{padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.more{display:block;width:100%;padding:12px;text-align:center;font-weight:700;font-size:14px;border-top:1px solid var(--line);color:var(--gold-ink);background:var(--gold-soft)}
.more:hover{filter:brightness(.97)}
/* fixtures */
.fx{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.fx .day{text-align:center;font:800 34px/.9 "Big Shoulders Display"}
.fx .day small{display:block;font:700 13px/1.3 "Hanken Grotesk";color:var(--muted)}
.fx .o{display:flex;align-items:center;gap:10px;min-width:0}
.fx .o b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.fx .o small{display:block;color:var(--muted);font-size:13px}
.fx .r{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.fx .ko{font:700 22px/1 "Big Shoulders Display"}
.month{font:700 22px/1 "Big Shoulders Display";color:var(--muted);padding:22px 0 8px}
/* table */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:700;color:var(--muted);text-align:right;padding:10px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;text-align:right;border-top:1px solid var(--line);font-size:15px}
th:first-child,td:first-child{text-align:center;width:36px;color:var(--muted);padding-left:12px}
th:nth-child(2),td:nth-child(2){text-align:left}
td:nth-child(2) button{display:flex;align-items:center;gap:10px;font-weight:500;width:100%}
td:nth-child(2) .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
td:last-child,th:last-child{padding-right:14px;font-weight:700}
td .badge{--s:24px}
tr.own td{background:var(--gold-soft);font-weight:600}
tr.own td:first-child{box-shadow:inset 4px 0 var(--gold)}
.dk{display:none}
@media(min-width:640px){.dk{display:table-cell}}
/* cups */
.route{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center}
.route:first-of-type{border-top:0}
.route .d{color:var(--muted);font-size:14px;font-weight:600}
.cup-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:16px 16px 6px}
.cup-h h3{font:700 26px/1 "Big Shoulders Display"}
.cup-h span{color:var(--muted);font-size:13px}
.bracket{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:12px;overflow-x:auto;min-width:0}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:150px}
.bcol h4{font:700 16px/1 "Big Shoulders Display";color:var(--muted)}
.tie{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.tie div{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 9px;font-size:13px;border-top:1px solid var(--line)}
.tie div:first-child{border-top:0}
.tie div.w{font-weight:700}
.tie div.us{background:var(--gold-soft)}
.tie b{font:800 17px/1 "Big Shoulders Display"}
.tie span{display:flex;align-items:center;gap:6px;min-width:0}
.tie span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tie .badge{--s:18px}
.note{color:var(--muted);font-size:14px;padding:6px 16px 16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));max-height:85vh;background:var(--card);color:var(--ink);margin:auto}
dialog::backdrop{background:rgba(10,12,15,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 4px}
.dh h2{font:700 28px/1 "Big Shoulders Display"}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;scrollbar-width:thin}
.chips button{flex:none;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:14px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
dialog input{display:block;width:calc(100% - 36px);margin:4px 18px 8px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:inherit}
.tlist{overflow-y:auto;max-height:44vh;padding:0 8px 12px}
.tlist button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:10px}
.tlist button:hover{background:var(--paper)}
.tlist button[aria-current=true]{background:var(--gold-soft);font-weight:700}
.tlist .badge{--s:28px}
footer{margin-top:48px;padding:24px 0 8px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
footer a{font-weight:600}
@media(min-width:900px){
 body{padding-bottom:0}
 nav.tabs{position:static;border:0;background:none;padding:0;max-width:1080px;margin:0 auto}
 header .wrap{height:64px}
 .brand small{display:block}
 nav.tabs{display:none}
 .dnav{display:flex!important}
}
.dnav{display:none;gap:4px;margin-left:12px}
.dnav button{padding:8px 14px;border-radius:9px;color:#C9CDD3;font-weight:600;font-size:15px}
.dnav button:hover{background:rgba(255,255,255,.1);color:#fff}
.dnav button[aria-current=page]{background:var(--gold);color:#14161A}
main{min-height:60vh}

body{padding-bottom:0}
.age{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px}
.age h2{font:800 34px/1 "Big Shoulders Display"}.age span{color:var(--muted);font-size:14px}
.teams{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
a.tc{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;border-bottom:4px solid var(--gold);transition:transform .15s}
a.tc:hover{transform:translateY(-2px)}
.tc .h{display:flex;gap:12px;align-items:center}
.tc .h b{font:800 24px/1 "Big Shoulders Display";display:block}
.tc .h small{color:var(--muted);font-size:13px}
.tc .pos{margin-left:auto;text-align:right;font:800 30px/1 "Big Shoulders Display"}.tc .pos small{display:block;font:500 12px/1.2 "Hanken Grotesk"}
.tc .row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.tc .row .l{color:var(--muted);white-space:nowrap}.tc .row .v{font-weight:600;text-align:right}
.tc .f{width:26px;height:26px;font-size:14px;border-radius:6px}
.hero2{margin:28px 0 0;padding:22px;background:var(--block);color:var(--block-ink);border-radius:16px;border-bottom:5px solid var(--gold)}
.hero2 .big{font:800 clamp(30px,6vw,44px)/1 "Big Shoulders Display"}.hero2 p{opacity:.8;margin-top:6px}
.hero2 .nx{margin-top:14px;color:var(--gold);font:700 22px/1.2 "Big Shoulders Display"}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand" id="brand"></div>
<button class="icon" id="theme" aria-label="Switch light or dark mode"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>
<div class="wrap"><div id="hero"></div><main id="main"></main></div>
<footer><div class="wrap"><span id="upd"></span><span>Data from FA Full-Time. <a href="modern.html">All teams</a> and <a href="index.html">classic teletext</a></span></div></footer>
<script>
const U=s=>String(s).toUpperCase();
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const clean=s=>String(s||"").replace(/&amp;/g,"&").replace(/&#39;/g,"'").replace(/&quot;/g,'"').trim();
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pdate=dt=>{const m=String(dt||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}:\d{2}))?/);if(!m)return null;let y=+m[3];if(y<100)y+=2000;return{day:+m[1],mon:+m[2],yr:y,t:m[4]||""};};
const ts=d=>new Date(d.yr,d.mon-1,d.day).getTime();
const isLions=n=>/^loughborough lions/i.test(clean(n));
function badge(){return '<span class="bwrap"><span class="badge img" style="--s:44px"><img src="crest.png" alt=""></span></span>';}
function lname(L){const c=(L.fixtures||[]).concat(L.results||[]).map(o=>o.competition).find(x=>x);return clean(c||L.name||"");}
const ord=n=>n+(["th","st","nd","rd"][(n%100>10&&n%100<14)?0:n%10<4?n%10:0]);
function build(id,L,team){
  const val=o=>({home:clean(o.homeTeam),away:clean(o.awayTeam),d:pdate(o.fixtureDateTime),hs:o.homeScore,as:o.awayScore});
  const today=new Date();today.setHours(0,0,0,0);
  const all=[...(L.fixtures||[]),...(L.results||[])].map(val).filter(x=>x.d);
  const mine=x=>x.home===team||x.away===team;
  const next=(L.fixtures||[]).map(val).filter(x=>x.d&&mine(x)&&ts(x.d)>=today.getTime()).sort((a,b)=>ts(a.d)-ts(b.d))[0];
  const rs=(L.results||[]).map(val).filter(x=>x.d&&mine(x)&&x.hs!==""&&x.hs!=null).sort((a,b)=>ts(b.d)-ts(a.d));
  const tb={};
  (L.results||[]).map(val).filter(x=>x.d&&x.hs!==""&&x.hs!=null).forEach(r=>{const a=+r.hs,b=+r.as;
    [r.home,r.away].forEach(n=>tb[n]=tb[n]||{n,p:0,pts:0,gd:0,gf:0});
    tb[r.home].p++;tb[r.away].p++;tb[r.home].gd+=a-b;tb[r.away].gd+=b-a;tb[r.home].gf+=a;tb[r.away].gf+=b;
    if(a>b)tb[r.home].pts+=3;else if(a<b)tb[r.away].pts+=3;else{tb[r.home].pts++;tb[r.away].pts++;}});
  let rank=null,of=0;
  if(Array.isArray(L.table)&&L.table.length){const t=L.table.map(x=>({n:clean(x.teamName||x.team||x.name),pts:+(x.points??x.pts)||0}));of=t.length;const i=t.findIndex(x=>x.n===team);if(i>=0)rank=i+1;}
  else{const t=Object.values(tb).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.n.localeCompare(b.n));of=t.length;const i=t.findIndex(x=>x.n===team);if(i>=0)rank=i+1;}
  const form=rs.slice(0,5).map(r=>{const h=r.home===team,f=h?+r.hs:+r.as,a=h?+r.as:+r.hs;return f>a?"W":f<a?"L":"D";});
  return {id,team,league:lname(L),next,last:rs[0],rank,of,form};
}
const j=u=>fetch(u,{cache:"no-cache"}).then(r=>r.ok?r.json():Promise.reject()).catch(()=>null);
(async()=>{
  try{const t=localStorage.getItem("lions-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}
  document.getElementById("theme").onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;const n=dark?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("lions-theme",n);}catch(e){}};
  document.getElementById("brand").innerHTML=badge()+"<div><b>Loughborough Lions AFC</b><small>Every Lions team</small></div>";
  const d=await j("data.json"),c=await j("cups.json");
  if(!d){document.getElementById("main").innerHTML='<div class="card empty" style="margin-top:20px">The latest fixtures could not be loaded. Refresh the page to try again.</div>';return;}
  const cards=[];
  Object.entries(d.leagues||{}).forEach(([id,L])=>{const names=new Set();
    [...(L.fixtures||[]),...(L.results||[])].forEach(o=>[o.homeTeam,o.awayTeam].forEach(n=>{if(isLions(n))names.add(clean(n));}));
    names.forEach(n=>cards.push(build(id,L,n)));});
  const groups={};cards.forEach(x=>{const m=/^u(\d+)/i.exec(x.id);const a=m?+m[1]:99;(groups[a]=groups[a]||[]).push(x);});
  const today=new Date();today.setHours(0,0,0,0);
  const nexts=cards.filter(x=>x.next).sort((a,b)=>ts(a.next.d)-ts(b.next.d));
  const nx=nexts[0];
  document.getElementById("hero").innerHTML=`<section class="hero2"><div class="big">${cards.length} Lions teams</div><p>${Object.keys(groups).length>1?"Across "+Object.keys(groups).length+" age groups.":"Currently showing the Under 12s. More age groups appear here once their leagues are added."}</p>${nx?`<div class="nx">Next up: ${esc(nx.team.replace(/^Loughborough Lions AFC /,""))} v ${esc(clean(nx.next.home===nx.team?nx.next.away:nx.next.home))}, ${DAYS[new Date(ts(nx.next.d)).getDay()]} ${nx.next.d.day} ${MONTHS[nx.next.d.mon-1]}${nx.next.d.t?" "+nx.next.d.t:""}</div>`:""}</section>`;
  document.getElementById("main").innerHTML=Object.keys(groups).sort((a,b)=>a-b).map(a=>{
    const g=groups[a].sort((x,y)=>(x.rank||99)-(y.rank||99)||x.team.localeCompare(y.team));
    return `<div class="age"><h2>Under ${a}s</h2><span>${g.length} team${g.length>1?"s":""}</span></div><div class="teams">`+g.map(x=>{
      const nm=x.team.replace(/^Loughborough Lions AFC /,"");
      const nxt=x.next?`${DAYS[new Date(ts(x.next.d)).getDay()]} ${x.next.d.day} ${MONTHS[x.next.d.mon-1]}${x.next.d.t?", "+x.next.d.t:""}`:"";
      const lr=x.last?(()=>{const h=x.last.home===x.team;return `${h?x.last.hs:x.last.as}-${h?x.last.as:x.last.hs} v ${esc(clean(h?x.last.away:x.last.home))}`;})():"";
      return `<a class="tc" href="modern.html#${encodeURIComponent(x.id)}|${encodeURIComponent(x.team)}|overview"><div class="h">${badge()}<div><b>${esc(nm)}</b><small>${esc(x.league.replace(/^U\d+\s+Div\s*\d+\s*[-:]?\s*/i,"")||"")}</small></div>${x.rank?`<div class="pos">${ord(x.rank)}<small>of ${x.of}</small></div>`:""}</div>
      <div class="row"><span class="l">Next match</span><span class="v">${nxt?esc(nxt)+"<br><span style='font-weight:400;color:var(--muted)'>"+(x.next.home===x.team?"v ":"at ")+esc(clean(x.next.home===x.team?x.next.away:x.next.home))+"</span>":"None listed"}</span></div>
      <div class="row"><span class="l">Last result</span><span class="v">${lr||"None yet"}</span></div>
      <div class="row"><span class="l">Form</span><span class="form">${x.form.map(o=>`<span class="f ${o}">${o}</span>`).join("")||"-"}</span></div></a>`;}).join("")+"</div>";}).join("");
  if(d.updated){const t=new Date(d.updated);if(!isNaN(t))document.getElementById("upd").textContent="Last changed "+t.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}
})();
</script></body></html>
