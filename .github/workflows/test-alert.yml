name: Test alert
# Sends a sample alert to the private Div 1 channel whenever test-alert.txt is pushed (the file's text is the message).
on:
  push:
    branches: [main]
    paths: ['test-alert.txt']
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send sample
        run: |
          T=$(grep -o "lionstext-div1-[a-f0-9]*" notify.php | head -1)
          curl -sS -m 20 -X POST -H "Title: Div 1: full time" -H "Tags: soccer" -H "Click: https://jammyguk.github.io/LLAFC/" -H "Icon: https://jammyguk.github.io/LLAFC/icon-192.png" --data-binary @test-alert.txt "https://ntfy.sh/$T" -w "\nHTTP %{http_code}\n"
      - name: Check the channel holds the message
        run: |
          T=$(grep -o "lionstext-div1-[a-f0-9]*" notify.php | head -1)
          echo "Topic: $T"
          curl -sS -m 20 "https://ntfy.sh/$T/json?poll=1&since=12h"
