name: Update data
on:
  schedule:
    # Sundays 10am-4pm UK time: scan every 5 minutes (match time).
    - cron: '*/5 9-15 * * 0'
    # Sundays 4pm-8pm UK time: scan every 15 minutes.
    - cron: '*/15 15-19 * * 0'
    # Every other time: every 30 minutes from 7am to 10pm UK time, then every 3 hours overnight.
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: update-data
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          dow=$(TZ=Europe/London date +%u)    # 7 = Sunday
          hour=$(TZ=Europe/London date +%-H)
          run=true
          case "$SCHED" in
            '*/5 9-15 * * 0')    { [ "$dow" = 7 ] && [ "$hour" -ge 10 ] && [ "$hour" -le 15 ]; } || run=false ;;
            '*/15 15-19 * * 0')  { [ "$dow" = 7 ] && [ "$hour" -ge 16 ] && [ "$hour" -le 19 ]; } || run=false ;;
            '*/30 * * * *')
              if [ "$dow" = 7 ] && [ "$hour" -ge 10 ] && [ "$hour" -le 19 ]; then run=false        # Sunday match window has its own schedules
              elif [ "$hour" -ge 7 ] && [ "$hour" -le 21 ]; then run=true                         # daytime: every 30 minutes
              else { [ $((hour % 3)) = 0 ] && [ "$(date +%-M)" -lt 20 ]; } || run=false; fi       # overnight: about every 3 hours
              ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "UK day=$dow hour=$hour schedule=[$SCHED] run=$run"

  # Reads the data from FullTime using our own copy of the open-source FullTimeAPI
  # (pinned to the version we tested). This job can only READ the repo.
  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jwhughes-work/FullTimeAPI
          ref: efaf777b6f18d03c31f6647be2339af3e7580739
          path: api
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
      - name: Build the API
        run: cd api && dotnet build -c Release 2>&1 | tail -3
      - name: Install its browser
        run: pwsh api/FullTimeAPI/bin/Release/net9.0/playwright.ps1 install --with-deps chromium 2>&1 | tail -2
      - name: Start the API
        run: |
          cd api
          nohup dotnet run --no-build -c Release --project FullTimeAPI --urls http://127.0.0.1:5069 > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:5069/swagger/index.html && break; sleep 2; done
      - name: Fetch the data
        env:
          API_BASE: http://127.0.0.1:5069/api
          MAX_PARALLEL: '6'
        run: php fetch.php
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data.json
          retention-days: 1
      - name: API log
        if: failure()
        run: tail -40 api.log || true

  # Saves data.json into the repo. Runs none of the downloaded code.
  save:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: new
      - name: Commit data.json
        run: |
          cp data.json /tmp/old.json
          cp new/data.json data.json
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          if ! git diff --staged --quiet; then
            git commit -m "Update data"
            git pull --rebase origin main
            git push
            # Private Div 1 alerts (ntfy). Safe to fail: never blocks the data update.
            php notify.php /tmp/old.json data.json || true
          fi
