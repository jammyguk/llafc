name: Update data
on:
  schedule:
    # Sundays: every 15 minutes from 10am UK time (runs from 09:00 UTC; the first
    # hour is skipped in winter by the check below) until the evening.
    - cron: '*/15 9-19 * * 0'
    # Every other time: every 3 hours.
    - cron: '0 */3 * * *'
  workflow_dispatch:
concurrency:
  group: update-data
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          dow=$(TZ=Europe/London date +%u)    # 7 = Sunday
          hour=$(TZ=Europe/London date +%-H)
          run=true
          # the 15-minute runs only start at 10am UK time
          if [ "$SCHED" = '*/15 9-19 * * 0' ] && [ "$hour" -lt 10 ]; then run=false; fi
          # the 3-hourly runs step aside while the 15-minute runs are going
          if [ "$SCHED" = '0 */3 * * *' ] && [ "$dow" = 7 ] && [ "$hour" -ge 10 ] && [ "$hour" -le 20 ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "UK day=$dow hour=$hour run=$run"

  # Reads the data from FullTime using our own copy of the open-source FullTimeAPI
  # (pinned to the version we tested). This job can only READ the repo.
  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jwhughes-work/FullTimeAPI
          ref: efaf777b6f18d03c31f6647be2339af3e7580739
          path: api
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
      - name: Build the API
        run: cd api && dotnet build -c Release 2>&1 | tail -3
      - name: Install its browser
        run: pwsh api/FullTimeAPI/bin/Release/net9.0/playwright.ps1 install --with-deps chromium 2>&1 | tail -2
      - name: Start the API
        run: |
          cd api
          nohup dotnet run --no-build -c Release --project FullTimeAPI --urls http://127.0.0.1:5069 > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:5069/swagger/index.html && break; sleep 2; done
      - name: Fetch the data
        env:
          API_BASE: http://127.0.0.1:5069/api
          MAX_PARALLEL: '4'
        run: php fetch.php
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data.json
          retention-days: 1
      - name: API log
        if: failure()
        run: tail -40 api.log || true

  # Saves data.json into the repo. Runs none of the downloaded code.
  save:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: new
      - name: Commit data.json
        run: |
          cp new/data.json data.json
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update data" && git pull --rebase origin main && git push)
