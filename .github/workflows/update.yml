name: Update data
on:
  schedule:
    # Sundays 10am-4pm UK time: scan every 5 minutes (match time).
    - cron: '*/5 9-15 * * 0'
    # Sundays 4pm-8pm UK time: scan every 15 minutes.
    - cron: '*/15 15-19 * * 0'
    # Every other time: every 30 minutes from 7am to 10pm UK time, then every 3 hours overnight.
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: update-data
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          dow=$(TZ=Europe/London date +%u)    # 7 = Sunday
          hour=$(TZ=Europe/London date +%-H)
          run=true
          case "$SCHED" in
            '*/5 9-15 * * 0')    { [ "$dow" = 7 ] && [ "$hour" -ge 10 ] && [ "$hour" -le 15 ]; } || run=false ;;
            '*/15 15-19 * * 0')  { [ "$dow" = 7 ] && [ "$hour" -ge 16 ] && [ "$hour" -le 19 ]; } || run=false ;;
            '*/30 * * * *')
              if [ "$hour" -ge 7 ] && [ "$hour" -le 21 ]; then run=true                         # daytime: every 30 minutes
              else { [ $((hour % 3)) = 0 ] && [ "$(date +%-M)" -lt 20 ]; } || run=false; fi       # overnight: about every 3 hours
              ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "UK day=$dow hour=$hour schedule=[$SCHED] run=$run"

  # Reads the data from FullTime using our own copy of the open-source FullTimeAPI
  # (pinned to the version we tested). This job can only READ the repo.
  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jwhughes-work/FullTimeAPI
          ref: efaf777b6f18d03c31f6647be2339af3e7580739
          path: api
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
      - name: Build the API
        run: |
          # Small patch: also read each fixture's "Status / Notes" column (Postponed etc.).
          # If the patched build ever fails, fall back to the untouched original.
          python3 scripts/patch_api.py api
          cd api
          if ! dotnet build -c Release > ../build.log 2>&1; then
            tail -20 ../build.log; echo "Patched build failed - using the original"
            git checkout -- . && dotnet build -c Release 2>&1 | tail -3
          else tail -3 ../build.log; fi
      - name: Install its browser
        run: pwsh api/FullTimeAPI/bin/Release/net9.0/playwright.ps1 install --with-deps chromium 2>&1 | tail -2
      - name: Start the API
        run: |
          cd api
          nohup dotnet run --no-build -c Release --project FullTimeAPI --urls http://127.0.0.1:5069 > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:5069/swagger/index.html && break; sleep 2; done
      - name: Fetch the data
        env:
          API_BASE: http://127.0.0.1:5069/api
          MAX_PARALLEL: '6'
        run: php fetch.php
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data.json
          retention-days: 1
      - name: API log
        if: failure()
        run: tail -40 api.log || true

  # Reads every U12/U13 cup (fixtures and results) from FullTime into cups.json.
  # Separate job so a problem here can never stop the league data updating.
  cups:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1 2>&1 | tail -2
          npx playwright install --with-deps chromium 2>&1 | tail -2
      - name: Read the cups
        run: node scripts/fetch_cups.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cups
          path: cups.json
          retention-days: 1

  # Saves data.json into the repo. Runs none of the downloaded code.
  save:
    needs: [fetch, cups]
    if: ${{ always() && needs.fetch.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: new
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cups
          path: newcups
      - name: Commit data.json
        run: |
          cp data.json /tmp/old.json
          cp new/data.json data.json
          # Cups are optional: only take the file if it parses as JSON with a cups list.
          if [ -f newcups/cups.json ] && php -r 'exit(is_array(json_decode(file_get_contents("newcups/cups.json"),true)["cups"]??null)?0:1);'; then cp newcups/cups.json cups.json; fi
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json cups.json
          changed=0; git diff --staged --quiet || changed=1
          # Record when Full-Time was last checked (shown on the site as "last refreshed").
          echo "{\"checked\":\"$(date -u '+%Y-%m-%d %H:%M:%S') UTC\"}" > checked.json
          git add checked.json
          if ! git diff --staged --quiet; then
            git commit -m "$([ $changed = 1 ] && echo 'Update data' || echo 'Checked Full-Time, no changes')"
            git pull --rebase origin main
            git push
            # Private Div 1 alerts (ntfy). Safe to fail: never blocks the data update.
            [ $changed = 1 ] && { php notify.php /tmp/old.json data.json || true; }
          fi
