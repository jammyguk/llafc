name: Match day loop
# GitHub often skips frequent scheduled runs, so on Sundays one long job starts and then
# checks Full-Time itself every 5 minutes until 7pm UK time. Several start times are listed
# because GitHub can be late; only one loop runs at a time and a late start just carries on.
on:
  schedule:
    - cron: '45 8 * * 0'
    - cron: '45 9 * * 0'
    - cron: '45 14 * * 0'
    - cron: '45 15 * * 0'
  workflow_dispatch:
concurrency:
  group: match-day-loop
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Is it match time?
        id: t
        run: |
          dow=$(TZ=Europe/London date +%u); hour=$(TZ=Europe/London date +%-H)
          go=true
          if [ "${{ github.event_name }}" = schedule ]; then
            { [ "$dow" = 7 ] && [ "$hour" -ge 9 ] && [ "$hour" -le 18 ]; } || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "dow=$dow hour=$hour go=$go"
      - uses: actions/checkout@v4
        if: steps.t.outputs.go == 'true'
      - uses: actions/checkout@v4
        if: steps.t.outputs.go == 'true'
        with:
          repository: jwhughes-work/FullTimeAPI
          ref: efaf777b6f18d03c31f6647be2339af3e7580739
          path: api
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        if: steps.t.outputs.go == 'true'
        with:
          dotnet-version: '9.0.x'
      - uses: shivammathur/setup-php@v2
        if: steps.t.outputs.go == 'true'
        with:
          php-version: '8.2'
          extensions: curl
      - uses: actions/setup-node@v4
        if: steps.t.outputs.go == 'true'
        with:
          node-version: '20'
      - name: Build the API
        if: steps.t.outputs.go == 'true'
        run: |
          python3 scripts/patch_api.py api
          cd api
          if ! dotnet build -c Release > ../build.log 2>&1; then
            tail -20 ../build.log; echo "Patched build failed - using the original"
            git checkout -- . && dotnet build -c Release 2>&1 | tail -3
          else tail -3 ../build.log; fi
      - name: Install browsers
        if: steps.t.outputs.go == 'true'
        run: |
          pwsh api/FullTimeAPI/bin/Release/net9.0/playwright.ps1 install --with-deps chromium 2>&1 | tail -2
          mkdir -p /tmp/cupsrun && cd /tmp/cupsrun && npm install --no-save --no-package-lock playwright@1.49.1 2>&1 | tail -1 && npx playwright install --with-deps chromium 2>&1 | tail -1
      - name: Start the API
        if: steps.t.outputs.go == 'true'
        run: |
          cd api
          nohup dotnet run --no-build -c Release --project FullTimeAPI --urls http://127.0.0.1:5069 > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:5069/swagger/index.html && break; sleep 2; done
      - name: Check every 5 minutes until 7pm
        if: steps.t.outputs.go == 'true'
        env:
          API_BASE: http://127.0.0.1:5069/api
          MAX_PARALLEL: '6'
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "data-bot"; git config user.email "bot@users.noreply.github.com"
          start=$(date +%s); n=0
          while :; do
            hour=$(TZ=Europe/London date +%-H)
            [ "$hour" -ge 19 ] && [ "${{ github.event_name }}" = schedule ] && { echo "7pm - done"; break; }
            [ $(( $(date +%s) - start )) -gt 19800 ] && { echo "5.5 hours - handing over"; break; }
            t0=$(date +%s); n=$((n+1)); echo "=== scan $n at $(date -u +%H:%M:%S)"
            git fetch -q origin main && git reset -q --hard origin/main   # start from the latest saved files (keeps any hand edits)
            cp data.json /tmp/old.json
            php fetch.php || echo "fetch failed"
            # every 4th scan (about 20 min) also read the cups (best effort)
            if [ $((n % 4)) = 1 ]; then
              cp cups.json /tmp/cups.before 2>/dev/null
              ( cp scripts/fetch_cups.mjs /tmp/cupsrun/ && timeout 240 node /tmp/cupsrun/fetch_cups.mjs 2>&1 | grep -E "cup |cups|Could|Too few|No change" ) || true
            fi
            changed=0; git diff --quiet data.json cups.json || changed=1
            echo "{\"checked\":\"$(date -u '+%Y-%m-%d %H:%M:%S') UTC\"}" > checked.json
            git add data.json cups.json checked.json
            git commit -q -m "$([ $changed = 1 ] && echo 'Update data' || echo 'Checked Full-Time, no changes')"
            ok=0
            for k in 1 2 3; do
              git push -q origin main && { ok=1; break; }
              git pull -q --rebase -X theirs origin main; sleep 3
            done
            echo "changed=$changed saved=$ok"
            [ $changed = 1 ] && [ $ok = 1 ] && { php notify.php /tmp/old.json data.json || true; }
            used=$(( $(date +%s) - t0 )); [ $used -lt 300 ] && sleep $(( 300 - used ))
          done
      - name: API log
        if: failure()
        run: tail -40 api.log || true
