.ll-top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.94);border-bottom:1px solid #E4E2DC;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-family:'Archivo','Helvetica Neue',Arial,sans-serif;transition:box-shadow .3s ease}
.ll-top.is-scrolled{box-shadow:0 8px 24px rgba(14,14,14,0.08)}
.ll-top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:24px;transition:padding .3s ease}
.ll-top.is-scrolled .ll-top-in{padding-top:6px;padding-bottom:6px}
.ll-brand{display:flex;align-items:center;gap:10px;color:#0E0E0E;text-decoration:none}
.ll-brand img{width:40px;height:43px;display:block;transition:width .3s ease,height .3s ease}
.ll-top.is-scrolled .ll-brand img{width:34px;height:37px}
.ll-brand b{display:block;font-weight:900;font-stretch:125%;font-size:22px;letter-spacing:-.02em;text-transform:uppercase;line-height:1}
.ll-nav{display:flex;align-items:center;gap:6px}
.ll-nav a{color:#0E0E0E;text-decoration:none;font-weight:600;font-size:15px;padding:9px 14px;border-radius:999px;transition:background-color .2s ease}
.ll-nav a:hover{background:#F3F2EE}
.ll-nav a.is-on{background:#FDD305}
.ll-join{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:#0E0E0E;color:#FFFFFF !important;text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap}
.ll-menu{display:none;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:#0E0E0E;color:#FFFFFF;cursor:pointer;font-weight:700;font-size:15px}
.ll-drawer{border-top:1px solid #E4E2DC;background:#FFFFFF;padding:8px 20px 22px;max-height:calc(100vh - 64px);overflow:auto}
.ll-drawer a{display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid #EEECE6;color:#0E0E0E;text-decoration:none;font-weight:900;font-stretch:125%;font-size:24px;letter-spacing:-.02em;text-transform:uppercase}
.ll-drawer a.is-on{box-shadow:inset 6px 0 0 #FDD305;padding-left:14px}
.ll-drawer .ll-join{margin-top:18px;justify-content:center;min-height:54px;font-size:17px;font-stretch:100%;letter-spacing:0;text-transform:none;border-bottom:0}
.ll-drawer .ll-sub{font-size:14px;font-weight:600;font-stretch:100%;letter-spacing:0;text-transform:none;color:#5C5A55}
@media (max-width: 1000px){.ll-nav,.ll-top-in > .ll-join{display:none}.ll-menu{display:inline-flex}}
@media (min-width: 1001px){.ll-drawer{display:none !important}}
@media (max-width: 640px){[style*="minmax(min(190px, 100%), 1fr)"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important}[style*="minmax(min(190px, 100%), 1fr)"] > div{min-height:84px !important;font-size:16px !important;padding:12px !important}[style*="minmax(min(240px, 100%), 1fr)"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important}[style*="font-size: 84px"]{font-size:58px !important}}

body{margin:0;background:#FFFFFF}
a{color:#0E0E0E}
@keyframes llMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ll-marquee{animation:llMarquee 60s linear infinite}
.ll-tile{transition:transform .3s cubic-bezier(.16,.84,.3,1)}
.ll-tile:hover{transform:translateY(-4px)}
.ll-rail{scrollbar-width:none}
.ll-rail::-webkit-scrollbar{display:none}
.ll-anim .rv{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.16,.84,.3,1),transform .8s cubic-bezier(.16,.84,.3,1)}
.ll-anim .rv.rv-s{transform:scale(.94)}
.ll-anim .rv.in{opacity:1;transform:none}
@media (min-width: 900px){#den figure{margin:0 !important;border-radius:28px !important}.ll-swipe{display:none}}
.ll-anim .ll-pop{opacity:0;transform:scale(.8) rotate(-8deg);animation:llPop .9s .1s cubic-bezier(.2,.9,.3,1.25) forwards}
.ll-anim .ll-in{opacity:0;transform:translateY(18px);animation:llIn .8s .35s cubic-bezier(.16,.84,.3,1) forwards}
.ll-anim .ll-in.d2{animation-delay:.5s}
.ll-anim .ll-in.d3{animation-delay:.65s}
@keyframes llPop{to{opacity:1;transform:none}}
.ll-anim .ll-pop.ll-float{animation:llPop .9s .1s cubic-bezier(.2,.9,.3,1.25) forwards,llFloat 6s 1.2s ease-in-out infinite}
@keyframes llFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ll-intro-hint{display:none}
.ll-anim .ll-intro-card{overflow:clip !important}
.ll-anim .ll-intro-pin{height:calc(100vh - 72px + 95vh);height:calc(100svh - 72px + 95svh)}
.ll-anim .ll-intro-stage{position:sticky !important;top:62px;height:calc(100vh - 80px);height:calc(100svh - 80px);padding-top:12px !important;padding-bottom:12px !important}
.ll-anim [data-crest]{will-change:transform}
.ll-anim .ll-intro-copy{opacity:0;will-change:opacity,transform}
.ll-anim .ll-intro-motto [data-mw]{opacity:0;will-change:opacity,transform}
.ll-anim .ll-intro-hint{display:flex;position:absolute;left:50%;bottom:16px;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transform:translateX(-50%);animation:llBob 1.6s ease-in-out infinite}
@keyframes llBob{50%{transform:translate(-50%,6px)}}
@keyframes llIn{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.ll-marquee{animation:none}.ll-tile{transition:none}.ll-float{animation:none !important}.ll-intro-hint{animation:none}}

body{margin:0;background:#FFFFFF}
a{color:#0E0E0E}
button{font:inherit}
.ll-team{transition:transform .25s cubic-bezier(.16,.84,.3,1),background-color .2s ease}
.ll-team:hover{transform:translateY(-3px)}
.ll-anim .rv{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.16,.84,.3,1),transform .8s cubic-bezier(.16,.84,.3,1)}
.ll-anim .rv.in{opacity:1;transform:none}
@media (max-width: 640px){.ll-teamgrid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:8px !important}.ll-teamgrid .ll-tname{font-size:19px !important}}
@media (prefers-reduced-motion: reduce){.ll-team{transition:none}}

body{margin:0;background:#FFFFFF}
a{color:#0E0E0E}
button{font:inherit}
.ll-prod{transition:transform .3s cubic-bezier(.16,.84,.3,1)}
.ll-prod:hover{transform:translateY(-4px)}
.ll-prod:hover .ll-prod-icon{transform:scale(1.08) rotate(-4deg)}
.ll-prod-icon{transition:transform .4s cubic-bezier(.16,.84,.3,1)}
.ll-anim .rv{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.16,.84,.3,1),transform .8s cubic-bezier(.16,.84,.3,1)}

@media (max-width: 640px){.ll-shopgrid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:8px !important}.ll-shopgrid .ll-pname{font-size:16px !important}}

    const prompts = { training: 'Add training days and times', coaches: 'Add manager and coaches', sponsors: 'Add sponsor' };
    const labels = { training: 'Training', coaches: 'Coaches', sponsors: 'Sponsor' };
    const order = ['training', 'coaches', 'sponsors'];
    const full = (t) => {
      const sparse = t.about === null;
      const rows = order
        .filter((k) => t[k] !== undefined || sparse)
        .map((k) => {
          const v = t[k];
          const has = v !== null && v !== undefined;
          return { label: labels[k], value: has ? v : '', has, missing: !has, prompt: prompts[k] };
        });
      const lv = t.live ? LIVE.teams[t.live] : null;
      const fixtures = (lv ? lv.upcoming : []).map((g) => Object.assign({}, g, {
        haLabel: g.ha === 'H' ? 'Home' : 'Away', bg: g.ha === 'H' ? accent : '#FFFFFF' }));
      return Object.assign({}, t, {
        rows, hasFixtures: fixtures.length > 0, fixtures,
        hasLeague: !!t.league, noLeague: !t.league,
        hasAbout: !!t.about,
        isRecruiting: t.recruiting === true, isFull: t.recruiting === false, statusUnknown: t.recruiting === null || t.recruiting === undefined,
        recruitText: t.recruitText || '',
        cta: t.cta || (t.recruiting ? 'Ask about joining' : 'Contact the club')
      });
    };
    const filterDefs = [
      { id: 'all', label: 'All teams' },
      { id: 'recruiting', label: 'Places available' }
    ];
    const f = this.state.filter;
    const filters = filterDefs.map((d) => {
      const on = d.id === f;
      return { label: d.label, pressed: on ? 'true' : 'false', bg: on ? '#0E0E0E' : '#FFFFFF', fg: on ? accent : '#0E0E0E', bd: on ? '#0E0E0E' : '#D6D3CB',
        pick: () => this.setState({ filter: d.id }) };
    });
    const shown = SQUADS.filter((t) => f === 'all' || (f === 'recruiting' ? t.recruiting === true : t.group === f));
    const selId = this.state.selected;
    const cards = shown.map((t) => {
      const on = t.id === selId;
      return { name: t.name, colour: t.colour, tag: t.tag || '', isRecruiting: t.recruiting === true,
        on: on ? 'true' : 'false', bg: on ? accent : '#F3F2EE', bd: on ? '#0E0E0E' : 'transparent',
        pick: () => { this.jump = true; this.setState({ selected: t.id }); } };
    });
    const ageOf = (t) => t.id === 'mini' ? 'Mini Academy' : (t.name.match(/^U\d+/) || [t.name])[0];
    const ageOrder = [];
    const byAge = {};
    cards.forEach((c, i) => {
      const t = shown[i], age = ageOf(t);
      if (!byAge[age]) { byAge[age] = []; ageOrder.push(age); }
      const shortName = /^U\d+\s+\S/.test(t.name) ? t.name.replace(/^U\d+\s+/, '') : t.name;
      byAge[age].push(Object.assign({}, c, { short: shortName }));
    });
    const groups = ageOrder.map((age) => ({ label: age, cards: byAge[age],
      countLabel: byAge[age].length === 1 ? '1 team' : byAge[age].length + ' teams' }));
    const sel = full(SQUADS.find((t) => t.id === selId) || SQUADS[0]);
    return { accent, filters, groups, sel, teamCount: SQUADS.length };
  }
}
