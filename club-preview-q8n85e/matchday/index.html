<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#FFFFFF;color:#0E0E0E;font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.45}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
.x{font-weight:900;font-stretch:125%;letter-spacing:-.025em;text-transform:uppercase;line-height:.95}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid #E4E2DC;padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:36px;height:39px;display:block}
.brand .x{font-size:20px}
.brand small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5C5A55;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;background:#0E0E0E;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.tabs{display:flex;gap:6px;padding:10px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:44px;padding:0 16px;border:1px solid #D6D3CB;border-radius:999px;background:#FFFFFF;font-weight:700;font-size:15px;cursor:pointer}
.tab[aria-selected="true"]{background:#0E0E0E;border-color:#0E0E0E;color:#FDD305}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 2px}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:#F3F2EE;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:#FDD305;box-shadow:inset 0 0 0 2px #0E0E0E}
.hero{position:relative;overflow:hidden;margin:14px 0 6px;border-radius:24px;background:#FDD305;padding:18px 18px 20px}
.hero .stripes{position:absolute;right:-10px;top:0;bottom:0;width:28%;background:repeating-linear-gradient(90deg,#0E0E0E 0 16px,transparent 16px 36px);opacity:.9;transition:background-position .1s linear}
.hero > *:not(.stripes){position:relative}
.hero .k{display:inline-block;padding:3px 10px;border-radius:999px;background:#0E0E0E;color:#FDD305;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hero .t{margin:10px 0 2px;font-size:44px}
.hero .m{font-weight:800;font-stretch:110%;font-size:19px;text-transform:uppercase;max-width:70%;overflow-wrap:anywhere}
.hero .s{margin-top:6px;font-size:14px;font-weight:600;max-width:70%}
.hero .cd{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;flex:none;padding:6px 12px;border-radius:999px;background:#FFFFFF;font-size:13px;font-weight:800}
.hero .hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:72%}
.hero .count{font-size:13px;font-weight:800}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;max-width:72%;margin-top:4px;scroll-behavior:smooth}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.slide .team{font-size:24px;margin-top:2px}
.hero .slide .m,.hero .slide .s{max-width:none}
.hfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;max-width:72%}
.dots{display:flex;gap:4px}
.dots button{width:24px;height:24px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dots button::after{content:"";width:8px;height:8px;border-radius:50%;background:rgba(14,14,14,.3);transition:width .25s ease,background-color .25s ease}
.dots button[aria-current="true"]::after{width:20px;border-radius:999px;background:#0E0E0E}
@media (min-width:700px){.slide .team{font-size:30px}}
.day{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.day h2{margin:0;font-size:20px;white-space:nowrap}
.day span{flex:1;height:3px;background:repeating-linear-gradient(90deg,#0E0E0E 0 10px,transparent 10px 16px)}
.card{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border-radius:18px;background:#F3F2EE;margin-bottom:8px}
.card.h{background:#FDD305}
.card .tm{font-weight:900;font-stretch:120%;font-size:22px;line-height:1;letter-spacing:-.02em}
.card .who{display:flex;flex-direction:column;min-width:0;gap:1px}
.card .who b{font-weight:800;font-stretch:110%;font-size:15px;text-transform:uppercase}
.card .who span{font-size:15px}
.card .who small{font-size:12px;font-weight:600;color:#3F3D39}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#FFFFFF;white-space:nowrap}
.tag.pp{background:#0E0E0E;color:#FDD305}
.res{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:#F3F2EE;margin-bottom:8px}
.oc{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;font-weight:900;font-stretch:120%;font-size:18px}
.oc.W{background:#FDD305;box-shadow:inset 0 0 0 2px #0E0E0E}
.oc.D{background:#FFFFFF;box-shadow:inset 0 0 0 2px #8F8D87}
.oc.L{background:#0E0E0E;color:#FFFFFF}
.res .ln{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:15px}
.res .sc{font-weight:900;font-stretch:120%;font-size:18px;padding:0 2px}
.res .ln .us{font-weight:800}
.res small{display:block;margin-top:2px;font-size:12px;font-weight:600;color:#5C5A55}
.tbl{border-radius:20px;background:#F3F2EE;margin-bottom:10px;overflow:hidden}
.tbl > button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:16px;border:0;background:transparent;cursor:pointer;text-align:left}
.tbl > button .x{font-size:19px}
.tbl > button small{display:block;margin-top:4px;font-size:13px;font-weight:600;color:#3F3D39}
.tbl > button .pos{flex:none;min-width:58px;padding:6px 10px;border-radius:12px;background:#0E0E0E;color:#FDD305;text-align:center;font-weight:900;font-stretch:120%;font-size:18px}
.rows{padding:0 10px 12px}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) 26px 26px 26px 26px 38px 34px;gap:4px;align-items:center;padding:8px 6px;border-radius:10px;font-size:14px}
.row.hd{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#5C5A55}
.row.us{background:#FDD305;font-weight:800}
.row span:nth-child(n+3){text-align:right}
.row b{font-weight:800}
.empty{padding:28px 18px;border-radius:20px;background:#F3F2EE;text-align:center;color:#3F3D39;font-weight:600}
.foot{margin:34px 0 0;background:#0E0E0E;color:#FFFFFF;padding-bottom:env(safe-area-inset-bottom)}
.foot .band{height:12px;background:repeating-linear-gradient(90deg,#FDD305 0 22px,#0E0E0E 22px 44px)}
.foot .wrap{padding-top:22px;padding-bottom:26px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:#BEBCB6}
.foot a{color:#FFFFFF}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#FDD305;box-shadow:0 0 0 0 rgba(253,211,5,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(253,211,5,0)}100%{box-shadow:0 0 0 0 rgba(253,211,5,0)}}
.in{animation:rise .5s cubic-bezier(.16,.84,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.in,.live i{animation:none}}
@media (min-width:700px){.hero{padding:26px 28px 28px}.hero .t{font-size:64px}.hero .m{font-size:24px}}
</style>
</head>

    '<div class="slides" id="slides" aria-roledescription="carousel" aria-label="Games kicking off at ' + esc(hm(f.when)) + '">' +
    same.map((g, i) => '<div class="slide" role="group" aria-roledescription="slide" aria-label="' + (i + 1) + ' of ' + n + '">' +
      '<div class="team x">' + esc(g.team) + '</div>' +
      '<div class="m">' + (g.ha === 'H' ? 'Home' : 'Away') + ' v ' + esc(g.opp) + '</div>' +
      '<div class="s">' + esc(g.comp) + ' · ' + esc(g.venue) + '</div></div>').join('') +
    '</div>' +
    '<div class="hfoot"><span class="cd">' + esc(when) + '</span>' +
    (n > 1 ? '<span class="dots">' + same.map((g, i) => '<button type="button" data-slide="' + i + '" aria-label="Show ' + esc(g.team) + '"' + (i === 0 ? ' aria-current="true"' : '') + '></button>').join('') + '</span>' : '') + '</div>';
  if (n < 2) return;
  const track = document.getElementById('slides');
  const mark = () => {
    const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
    const c = document.getElementById('hcount'); if (c) c.textContent = (i + 1) + ' / ' + n;
    el.querySelectorAll('.dots button').forEach((d, j) => d.setAttribute('aria-current', j === i ? 'true' : 'false'));
  };
  track.addEventListener('scroll', () => { clearTimeout(track._t); track._t = setTimeout(mark, 60); }, { passive: true });
  ['pointerdown', 'touchstart', 'wheel'].forEach((ev) => track.addEventListener(ev, () => { heroPause = Date.now() + 10000; }, { passive: true }));
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduced) heroTimer = setInterval(() => {
    if (Date.now() < heroPause || document.hidden) return;
    const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
    track.scrollTo({ left: ((i + 1) % n) * track.clientWidth });
  }, 3800);
}
function byDay(list, render) {
  if (!list.length) return '<div class="empty">Nothing to show here yet.</div>';
  let out = '', cur = '';
  list.forEach((x, i) => {
    const d = dayLabel(x.when);
    if (d !== cur) { cur = d; out += '<div class="day in"><h2 class="x">' + esc(d) + '</h2><span aria-hidden="true"></span></div>'; }
    out += render(x, i);
  });
  return out;
}
const fxCard = (f, i) => '<div class="card in' + (f.ha === 'H' ? ' h' : '') + '" style="animation-delay:' + Math.min(i, 8) * 40 + 'ms">' +
  '<span class="tm">' + esc(hm(f.when)) + '</span>' +
  '<span class="who"><b>' + esc(f.team) + '</b><span>v ' + esc(f.opp) + '</span><small>' + esc(f.comp) + ' · ' + esc(f.venue) + '</small></span>' +
  '<span class="tag' + (f.off ? ' pp' : '') + '">' + (f.off ? 'Postponed' : f.ha === 'H' ? 'Home' : 'Away') + '</span></div>';
const resCard = (r, i) => {
  const H = '<span class="' + (r.us === 'h' ? 'us' : '') + '">' + esc(r.home) + '</span>', A = '<span class="' + (r.us === 'a' ? 'us' : '') + '">' + esc(r.away) + '</span>';
  const sc = r.ok ? '<span class="sc">' + r.hs + '–' + r.as + '</span>' : '<span class="sc">–</span>';
  return '<div class="res in" style="animation-delay:' + Math.min(i, 8) * 40 + 'ms"><span class="oc ' + (r.out || 'D') + '" aria-label="' + ({ W: 'Win', D: 'Draw', L: 'Loss' }[r.out] || 'No result') + '">' + (r.out || '–') + '</span>' +
    '<span><span class="ln">' + H + sc + A + '</span><small>' + esc(r.team) + ' · ' + esc(r.comp) + (r.note ? ' · ' + esc(r.note) : '') + '</small></span></div>';
};
function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function tables() {
  if (S.team !== 'all' && !senior(S.team)) return JUNIOR;
  const names = Object.keys(M.teams).filter(senior).sort((a, b) => a.localeCompare(b, 'en', { numeric: true })).filter((n) => S.team === 'all' || n === S.team);
  if (!names.length) return '<div class="empty">No league table for this team yet.</div>';
  return names.map((n, i) => {
    const t = M.teams[n], open = S.team !== 'all' || S.open[n];
    const rows = '<div class="row hd"><span>#</span><span>Team</span><span>P</span><span>W</span><span>D</span><span>L</span><span>GD</span><span>Pts</span></div>' +
      t.rows.map((r, j) => '<div class="row' + (isLions(r.team) && lteam(r.team) === n ? ' us' : '') + '"><span>' + (j + 1) + '</span><span>' + esc(short(r.team)) + '</span><span>' + r.p + '</span><span>' + r.w + '</span><span>' + r.d + '</span><span>' + r.l + '</span><span>' + (r.gd > 0 ? '+' : '') + r.gd + '</span><span><b>' + r.pts + '</b></span></div>').join('');
    return '<div class="tbl in" style="animation-delay:' + i * 50 + 'ms"><button type="button" data-open="' + esc(n) + '" aria-expanded="' + !!open + '"><span><span class="x">' + esc(n) + '</span><small>' + esc(t.div) + '</small></span><span class="pos">' + ordinal(t.pos) + '</span></button>' +
      (open ? '<div class="rows">' + rows + '</div>' : '') + '</div>';
  }).join('');
}
function cups() {
  const fx = mine(M.fixtures).filter((f) => f.cup), rs = mine(M.results).filter((r) => r.cup && senior(r.team));
  if (!fx.length && !rs.length) return '<div class="empty">No cup ties for this team yet.</div>';
  return (fx.length ? '<div class="day in"><h2 class="x">Coming up</h2><span aria-hidden="true"></span></div>' + fx.map(fxCard).join('') : '') +
    (rs.length ? '<div class="day in"><h2 class="x">Played</h2><span aria-hidden="true"></span></div>' + rs.map(resCard).join('') : '');
}
function render() {
  if (!M) return;
  chips();
  const hk = S.team + '|' + (DATA && DATA.updated);
  if (hk !== render.hk) { render.hk = hk; hero(); }
  document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', b.dataset.v === S.view));
  const v = document.getElementById('view');
  v.innerHTML = S.view === 'fixtures' ? byDay(mine(M.fixtures), fxCard)
    : S.view === 'results' ? (S.team !== 'all' && !senior(S.team) ? JUNIOR : byDay(mine(M.results).filter((r) => senior(r.team)), resCard))
    : S.view === 'tables' ? tables() : cups();
}
document.addEventListener('click', (e) => {
  const c = e.target.closest('.chip'); if (c) { S.team = c.dataset.t; try { localStorage.setItem('lions-matchday-team', S.team); } catch (er) {} render(); return; }
  const t = e.target.closest('.tab'); if (t) { S.view = t.dataset.v; try { history.replaceState(null, '', '#' + S.view); } catch (er) {} render(); return; }
  const o = e.target.closest('[data-open]'); if (o) { const n = o.dataset.open; S.open[n] = !S.open[n]; render(); return; }
  const d = e.target.closest('[data-slide]'); if (d) { const tr = document.getElementById('slides'); heroPause = Date.now() + 10000; tr.scrollTo({ left: (+d.dataset.slide) * tr.clientWidth }); }
});
window.addEventListener('scroll', () => { const s = document.querySelector('.hero .stripes'); if (s) s.style.backgroundPosition = (window.pageYOffset * 0.4).toFixed(1) + 'px 0'; }, { passive: true });
const h0 = (location.hash || '').slice(1); if (['fixtures', 'results', 'tables', 'cups'].indexOf(h0) >= 0) S.view = h0;

function stamp() {
  const u = document.getElementById('upd');
  const when = String(DATA.updated || '').replace(/:\d\d UTC$/, ' UTC');
  u.innerHTML = '<i aria-hidden="true"></i>' + (live ? 'Live · updated ' : 'Saved copy · ') + esc(when);
}
async function load() {
  try {
    const q = '?t=' + Date.now();
    const [d, c] = await Promise.all([fetch('../../data.json' + q).then((r) => { if (!r.ok) throw 0; return r.json(); }), fetch('../../cups.json' + q).then((r) => r.ok ? r.json() : null).catch(() => null)]);
    DATA = d; CUPS = c || SNAP.cups; live = true;
  } catch (e) {
    if (!DATA) { DATA = SNAP.data; CUPS = SNAP.cups; live = false; }
  }
  M = model(); render(); stamp();
}
load();
setInterval(load, 5 * 60 * 1000);
</script>
